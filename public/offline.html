<!doctype html>
<!--
  Service Worker navigation fallback (see src/app/sw.ts's `fallbacks`
  config) — served in place of whatever page the browser actually asked
  for when that request fails offline and nothing better is cached for it.

  Deliberately a plain static file, NOT a Next.js app-router page: an
  earlier version lived at /offline as a real route, and it broke — the
  browser's address bar stays on the ORIGINAL failed URL (e.g.
  /es/pricing) while this response's HTML is served in its place, so a
  Next page here would hydrate its client router expecting /offline,
  see the actual URL doesn't match, and try to "correct" it — causing a
  navigation loop while still offline. A static file has no router to
  confuse, so it just renders.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión — RusoFácilapp</title>
    <style>
      :root {
        color-scheme: light;
        --background: #fff8ec;
        --foreground: #241c15;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        padding: 6rem 1.5rem;
        text-align: center;
        background: var(--background);
        color: var(--foreground);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .icon {
        font-size: 3rem;
      }
      h1 {
        margin-top: 1rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0.25rem 0 0;
        max-width: 24rem;
        font-size: 0.875rem;
        color: color-mix(in srgb, var(--foreground) 60%, transparent);
      }
      button {
        margin-top: 1.5rem;
        border: none;
        border-radius: 9999px;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        background: var(--foreground);
        color: var(--background);
        cursor: pointer;
      }
      button:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <!--
      ОДНА ЛОКАЛЬ, А НЕ ДВЕ СРАЗУ (заход 7.218). До 20.09.2026 экран
      печатал «Estás sin conexión — Вы не в сети» и обе подписи подряд:
      человек, зашедший на `/ru/...`, читал половину экрана по-испански.

      Локаль берётся из АДРЕСА, и это единственное, что здесь вообще
      можно знать: файл статический, отдаётся воркером вместо страницы, а
      адрес в строке браузера остаётся ИСХОДНЫМ (см. комментарий в шапке
      файла) — то есть `/ru/stories/...` или `/es/pricing`. Поэтому
      выбирать есть по чему, и ничего спрашивать у сервера не нужно.

      Обе половины лежат в разметке сразу, и лишняя убирается скриптом, а
      не дописывается им: при выключенном JS человек прочтёт обе — это
      хуже, чем одна, но лучше, чем пустой экран.
    -->
    <p class="icon" aria-hidden="true">📡</p>
    <h1 lang="es" data-locale="es">Estás sin conexión</h1>
    <h1 lang="ru" data-locale="ru">Вы не в сети</h1>
    <p lang="es" data-locale="es">Esta página no se guardó para uso sin conexión. Conéctate a internet e inténtalo de nuevo.</p>
    <p lang="ru" data-locale="ru">Эта страница не сохранена для офлайн-доступа. Подключитесь к интернету и попробуйте снова.</p>
    <button type="button" lang="es" data-locale="es" onclick="window.location.reload()">Reintentar</button>
    <button type="button" lang="ru" data-locale="ru" onclick="window.location.reload()">Повторить</button>
    <script>
      (function () {
        var lang = /^\/ru(\/|$)/.test(location.pathname) ? "ru" : "es";
        document.documentElement.lang = lang;
        // Заголовок вкладки — тоже подпись, и её человек видит первой.
        if (lang === "ru") document.title = "Нет соединения — RusoFácilapp";
        var nodes = document.querySelectorAll("[data-locale]");
        for (var i = 0; i < nodes.length; i++) {
          if (nodes[i].getAttribute("data-locale") !== lang) nodes[i].remove();
        }
      })();
    </script>
  </body>
</html>
