<!doctype html>
<!--
  Service Worker navigation fallback (see src/app/sw.ts's `fallbacks`
  config) — served in place of whatever page the browser actually asked
  for when that request fails offline and nothing better is cached for it.

  Deliberately a plain static file, NOT a Next.js app-router page: an
  earlier version lived at /offline as a real route, and it broke — the
  browser's address bar stays on the ORIGINAL failed URL (e.g.
  /es/pricing) while this response's HTML is served in its place, so a
  Next page here would hydrate its client router expecting /offline,
  see the actual URL doesn't match, and try to "correct" it — causing a
  navigation loop while still offline. A static file has no router to
  confuse, so it just renders.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión / Нет соединения — RusoFácilapp</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #fff8ec;
        --foreground: #241c15;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1b140f;
          --foreground: #f5ead2;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        padding: 6rem 1.5rem;
        text-align: center;
        background: var(--background);
        color: var(--foreground);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .icon {
        font-size: 3rem;
      }
      h1 {
        margin-top: 1rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0.25rem 0 0;
        max-width: 24rem;
        font-size: 0.875rem;
        color: color-mix(in srgb, var(--foreground) 60%, transparent);
      }
      button {
        margin-top: 1.5rem;
        border: none;
        border-radius: 9999px;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        background: var(--foreground);
        color: var(--background);
        cursor: pointer;
      }
      button:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <p class="icon" aria-hidden="true">📡</p>
    <h1>Estás sin conexión — Вы не в сети</h1>
    <p>Esta página no se guardó para uso sin conexión. Conéctate a internet e inténtalo de nuevo.</p>
    <p>Эта страница не сохранена для офлайн-доступа. Подключитесь к интернету и попробуйте снова.</p>
    <button type="button" onclick="window.location.reload()">Reintentar / Повторить</button>
  </body>
</html>
