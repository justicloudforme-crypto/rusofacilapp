# ОБХОД «КНОПОК СЛУШАТЬ» ПО ЖИВОМУ САЙТУ — РАЗ В НЕДЕЛЮ (7.293, долг 119).
#
# Что проверяется. Все страницы рассказов из карты сайта (`/es/stories/…`,
# 325 на 19.11.2026): если на странице нарисована кнопка «слушать», в той же
# разметке обязана быть настоящая запись (сторож долга 116).
# Вдобавок (`--audio`) — что КАЖДЫЙ звуковой файл, на который ссылаются эти
# страницы (370 на 19.11.2026), существует и отдаётся как звук.
#
# ДЕНЬГИ. Звук лежит в Vercel Blob, трафик платный, поэтому файлы НЕ
# качаются: HEAD-запрос (только заголовки, ≈0,7 КБ), при отказе HEAD —
# первые два байта. Скорость ограничена: два запроса одновременно и пауза
# 400 мс перед каждым. Замер 19.11.2026 (7.293) за один обход: страницы —
# 326 запросов, 54,5 МБ (это трафик сайта, не Blob); звук — 370 запросов,
# 0,25 МБ. В месяц (4,3 обхода) — ≈1 400 страниц / 237 МБ и ≈1 600
# HEAD-запросов / 1,1 МБ; цена — меньше $0,10 в месяц. Чтения боевой базы —
# ≈85 тыс. строк за обход (325 рендеров рассказа по ≈260 строк).
#
# ТРИ АГЕНТА (7.296, долг 121). Обход идёт трижды — браузером телефона,
# приложением Android и приложением iPhone (`--agents=web,android-app,ios-app`):
# страница рассказа ветвится по оболочке (замок, кнопка покупки, без
# подвала), и обход одним браузером путь приложения не видел. У каждого
# агента каждая страница обязана быть отрисована в его режиме — иначе
# проверка приложения слепа. Звуковые файлы — один раз, общим списком.
# Замер 20.11.2026 (Mac, живой прод): 975 страниц, у всех кнопка с записью,
# режим приложения узнан на 650 из 650; 976 запросов / 160,7 МБ трафика
# сайта, 370 звуков HEAD / 0,25 МБ, 487 с. В месяц ≈4 200 страниц / ≈0,7 ГБ
# и ≈1,1 млн строк Turso (≈255 тыс. за обход) — внутри тарифов Vercel Pro
# и Turso Developer; звук — как прежде. ПОДПИСЧИКОМ обход не ходит: вход на проде — запись
# (`PROGRESS.md` 3.2), это решение владельца (раздел 7).
#
# КАК УЗНАЕТ ВЛАДЕЛЕЦ. Красный прогон — письмо GitHub «Run failed» (Failed
# workflows), как у любого красного прогона по расписанию. Issue не
# заводится: это не «сайт упал», а «у части рассказов пропал звук», и
# разбирается он по журналу шага «Обход живого сайта».
#
# НАЖАТИЕ НАСТОЯЩИМ БРАУЗЕРОМ (7.311, долг 124) — второе задание того же
# обхода. Первое читает разметку рассказов `/es` и шлёт HEAD к файлам; оно не
# видит уроков и медиа (их адрес звука приходит после загрузки страницы),
# не видит `/ru` и не проверяет, что нажатие ЗАПУСКАЕТ звук. Второе задание
# открывает Chromium гостем на выборке бесплатных страниц — рассказы «Репка»
# и «Снегурочка», уроки A1/1, A1/2, A2/1, медиа «Катюша», алфавит; `/es` и
# `/ru` (11 страниц), — жмёт первую видимую кнопку «слушать» и ждёт, что
# аудиоэлемент заиграл (`playing`, время > 0,25 с) и файл ответил звуком.
# Платный звук не проверяется: решение владельца по долгу 121 — (б), пароля
# тест-учётки в GitHub нет. Замер 7.311: 11 из 11 звучат за 29 с; с битым
# адресом звука (`--break-audio`, каждый ответ хранилища → 404) — 11 из 11
# красные. Ручной запуск с `control: broken_audio` делает то же на раннере.
#
# Двусторонний. Перед живым обходом — контроль `--plant`: тот же обход по
# местному «сайту», исправный обязан дать зелёный, сломанный (подменённый
# адрес звука, HTML вместо звука, пустой файл, страница 500, кнопка без
# записи) — красный. Ручной запуск с `control: broken_target` направляет
# живой обход на заведомо мёртвый адрес — прогон обязан покраснеть.
name: Обход кнопок «слушать»

on:
  schedule:
    # Понедельник, 07:23 UTC (01:23 в Мехико) — ночью у учеников и не в
    # ноль часа, чтобы не толкаться с общей очередью расписаний GitHub.
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      control:
        description: "Контроль: none / broken_target (обход идёт на мёртвый адрес — обязан покраснеть) / broken_audio (нажатие: каждый файл звука подменён на 404 — обязано покраснеть)"
        type: choice
        default: none
        options:
          - none
          - broken_target
          - broken_audio

permissions:
  contents: read

concurrency:
  group: listen-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Рассказы — кнопка «слушать» и звуковые файлы
    runs-on: ubuntu-latest
    # Предел прежний (7.296): три агента с Mac — 487 с, с раннера один агент
    # шёл 208 с (×3 ≈ 10 мин).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Зависимости не нужны: обход — чистый Node (fetch), без браузера.
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"

      - name: Позитивный контроль — сломанный местный сайт обязан дать красный
        run: npm run check:silent-listen:plant

      - name: Обход живого сайта
        env:
          CONTROL: ${{ inputs.control }}
        run: |
          if [ "${CONTROL:-none}" = "broken_target" ]; then
            echo "КОНТРОЛЬ broken_target: обход идёт на заведомо мёртвый адрес — обязан покраснеть"
            npm run check:silent-listen:prod -- --base=http://127.0.0.1:59999 --audio --concurrency=2 --delay-ms=400 --retry-delay-ms=1000 --agents=web,android-app,ios-app
          else
            npm run check:silent-listen:prod -- --audio --concurrency=2 --delay-ms=400 --agents=web,android-app,ios-app
          fi

  play:
    name: Нажатие «слушать» — звук пошёл (уроки, медиа, рассказы; /es и /ru)
    runs-on: ubuntu-latest
    # Замер 7.311: 11 страниц за 29 с (с паузами 2 с — ≈1 мин); основное
    # время — установка браузера.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Версия Playwright — ключ кеша браузеров
        id: pw
        run: |
          echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Кеш браузеров Playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-chromium

      # Три попытки с паузой — тот же приём, что в `prod-smoke.yml` (7.282):
      # падали не браузеры, а зеркала apt.
      - name: Install Playwright browsers
        timeout-minutes: 14
        run: |
          set -uo pipefail
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-rf-retries > /dev/null
          for attempt in 1 2 3; do
            echo "::group::установка браузеров, попытка $attempt из 3"
            if [ "$attempt" -gt 1 ]; then
              sudo dpkg --configure -a || true
              sudo apt-get update || true
            fi
            if sudo env "PATH=$PATH" timeout -k 15 180 npx playwright install-deps chromium \
              && timeout -k 15 180 npx playwright install chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning title=Установка браузеров::попытка $attempt из 3 не удалась"
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          echo "::error title=Установка браузеров не удалась::три попытки — звук на живом сайте НЕ проверялся"
          exit 1

      - name: Позитивный контроль — битый звук на местном сайте обязан дать красный
        run: npm run check:silent-listen:play:plant

      - name: Нажатие «слушать» на живом сайте
        env:
          CONTROL: ${{ inputs.control }}
        run: |
          if [ "${CONTROL:-none}" = "broken_audio" ]; then
            echo "КОНТРОЛЬ broken_audio: каждый ответ хранилища звука подменён на 404 — обязан покраснеть"
            npm run check:silent-listen:play -- --break-audio --retry-delay-ms=5000
          else
            npm run check:silent-listen:play
          fi
