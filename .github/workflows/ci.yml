name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch/PR makes the previous run's checks moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Real Postgres/MySQL-style envs aren't needed: the app runs on SQLite,
  # and CI only needs a schema to push migrations against, not real data.
  DATABASE_URL: "file:./dev.db"
  # Any fixed value works here — CI never needs to verify a real cookie
  # signed by a real deployment, only that signing/verification round-trips.
  SESSION_SECRET: "ci-test-secret-do-not-use-in-production"

jobs:
  test:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push database schema
        run: npx prisma db push

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push database schema
        run: npx prisma db push

      # Word-games are "100% pre-generated, zero on-request computation" —
      # unlike lessons/exams (which fall back to a bundled content.json when
      # the DB has no rows), WordGamePuzzle has no fallback at all. Without
      # this, e2e/word-games.spec.ts runs against a completely empty table
      # (schema-only db push seeds nothing) and every assertion that expects
      # real puzzle content — including just finding a ★ tile on the picker
      # page — fails outright. Deterministic/idempotent, reads DATABASE_URL
      # only (no TURSO_* secrets exist in this workflow's env), so this is
      # always local to the ephemeral CI database, never production.
      - name: Seed word-games content
        run: npm run generate:word-games

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
