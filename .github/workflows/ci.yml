name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch/PR makes the previous run's checks moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Real Postgres/MySQL-style envs aren't needed: the app runs on SQLite,
  # and CI only needs a schema to push migrations against, not real data.
  DATABASE_URL: "file:./dev.db"
  # Any fixed value works here — CI never needs to verify a real cookie
  # signed by a real deployment, only that signing/verification round-trips.
  SESSION_SECRET: "ci-test-secret-do-not-use-in-production"

jobs:
  test:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push database schema
        run: npx prisma db push

      # Значок платности пишется в одном месте, а не пересказывается
      # (PROGRESS 7.137 часть 3). Дешёвая статическая проверка, поэтому
      # рядом с lint, а не в браузерной задаче.
      - name: Значок платности — один признак на весь сайт
        run: npm run check:access-marks

      - name: Тот же сторож — позитивный контроль
        run: npm run check:access-marks:plant

      # Заход 7.153. Вторая половина того же правила: значок не только
      # пишется в одном месте, но и НЕ ОБЕЩАЕТ ОТКРЫТЫМ то, что закрыто.
      # Замер по настоящей базе 09.09.2026 нашёл ровно этот класс в окне
      # поиска: 2210 пазлов из 3277 и 4553 карточки из 5771 печатались
      # открытыми. Проверка сверяет пометку не тем же выражением, каким
      # она ставится, а правилом бесплатного образца
      # (`isFreeWordGamePuzzle`, `isFreeTrialLesson`, `MediaItem.free`,
      # `Story.isPremium`). Уроки и медиа читаются из словарей и JSON, а
      # не из базы, поэтому и на пустой базе CI множество не пусто —
      # проверка не вакуумна и это видно числом в её отчёте.
      - name: Значок не обещает открытым то, что закрыто
        run: npm run check:mark-truth

      - name: Тот же сторож — позитивный контроль
        run: npm run check:mark-truth:plant

      # Ровно то, что 08.09.2026 позволило красному `npm run verify`
      # прожить на `main` незамеченным: check:brand входит в verify и не
      # входил сюда, и PR #220 прошёл CI зелёным с красной проверкой
      # внутри. Сторож ниже держит правило «команда verify обязана быть
      # либо здесь, либо в списке исключений PROGRESS.md с причиной».
      # 0,1 с — дешевле любой строки, которую он стережёт.
      - name: Каждая проверка verify стоит на пути мержа
        run: npm run check:ci-covers-verify

      - name: Тот же сторож — позитивный контроль
        run: npm run check:ci-covers-verify:plant

      # Долг критического пути цели A, первый: решение «есть ли доступ»
      # принимается в ОДНОМ месте. Окно C намерило 7 мест вне модуля плюс
      # 3 копии правила внутри него; после правки — 0 и 1. Проверка
      # статическая, базы не трогает, 0,1 с.
      - name: Решение о доступе принимается в одном месте
        run: npm run check:entitlement-point

      - name: Тот же сторож — позитивный контроль
        run: npm run check:entitlement-point:plant

      # Заход 7.146: коды доступа для первых учеников. Правило то же, что у
      # сторожа выше, и заведено оно ровно потому, что коды — первая с 7.145
      # функция, которая ВЫДАЁТ доступ: таблица AccessCode читается только из
      # своего модуля, выдача идёт общей `extendOrGrantSubscription`, а флага
      # доступа на User нет. Статическая, базы не трогает, 0,1 с.
      - name: Код доступа не создаёт второго пути к доступу
        run: npm run check:access-code-path

      - name: Тот же сторож — позитивный контроль
        run: npm run check:access-code-path:plant

      # Заход 7.148. Базу прогона e2e трогает ровно один процесс — сервер.
      # Правило вывели числами ещё в 7.134 (долг 58), но жило оно только в
      # комментарии одного маршрута, и хватило его ровно на один заход: 7.147
      # завела коды доступа отдельным процессом под `tsx`, и полный прогон в
      # форме CI дал 2 падения + 2 flaky, ни одно из которых не было в том
      # тесте, который писал. Статическая, базы не трогает, 0,1 с.
      - name: Базу прогона e2e пишет только сервер
        run: npm run check:e2e-single-writer

      - name: Тот же сторож — позитивный контроль
        run: npm run check:e2e-single-writer:plant

      # Заход 7.149, долги 94 и 95. Проба обязана уметь покраснеть. Класс
      # найден случайно в 7.147 (ожидание увода на /pricing, которого
      # страница не делает уже давно — условие было истинно всегда), и
      # подсадкой этого захода найдено девять таких проб. Механическую
      # половину класса сторож держит статически: мёртвый селектор класса,
      # селектор, доказанный только отрицанием, тест без единого
      # утверждения, `expect(x.every(...))` на возможно пустом списке и
      # тест, чей бюджет меньше суммы его собственных ожиданий (долг 95).
      # Базы не трогает, 0,3 с.
      - name: Проба обязана уметь покраснеть
        run: npm run check:e2e-live-probes

      - name: Тот же сторож — позитивный контроль
        run: npm run check:e2e-live-probes:plant

      # Заход 7.147, долг 91. Сырой SQL не сравнивает колонку DateTime и не
      # пишет её мимо формата Prisma. Правило выросло из находки 7.146:
      # Prisma хранит DateTime ТЕКСТОМ, и строка, положенная сырым клиентом
      # числом миллисекунд, ломает сравнение в SQL — живой код доступа
      # выглядел неизвестным. Статическая, базы не трогает, 0,3 с.
      - name: Сырой SQL не решает вопросов о времени за Prisma
        run: npm run check:raw-datetime

      - name: Тот же сторож — позитивный контроль
        run: npm run check:raw-datetime:plant

      # 0,4 с. Политика конфиденциальности и условия обязаны совпадать с
      # кодом: запись голоса никуда не отправляется — значит текст не имеет
      # права обещать её хранение (долг 73); и наоборот, новый внешний
      # обработчик обязан быть назван в обеих локалях (долг 74).
      - name: Политика совпадает с кодом
        run: npm run check:legal-truth

      - name: Тот же сторож — позитивный контроль
        run: npm run check:legal-truth:plant

      # 0,6 с. Три законных написания имени — и ни одного четвёртого:
      # RusoFácilapp (сайт), RusoFácil (витрина обеих платформ и имя
      # разработчика в Play), com.rusofacilapp.app (идентификатор). Сюда же
      # сведены пять литералов витринного имени: Xcode и Gradle читают свои
      # файлы, одной точки правды для них не существует.
      - name: Имя бренда пишется одинаково
        run: npm run check:brand

      - name: Тот же сторож — позитивный контроль
        run: npm run check:brand:plant

      # 0,2 с. Сводка таблицы долгов: сумма категорий обязана сходиться с
      # числом строк, иначе долг молча выпадает из счёта.
      - name: Сводка таблицы долгов сходится
        run: npm run count:debts

      - name: Тот же сторож — позитивный контроль
        run: npm run count:debts:plant

      # 0,3 с. Личность нативной сборки — одна и та же во всех местах, где
      # она объявлена. Отдельный сторож, а не расширение check:brand:
      # тот регистрозависим и намеренно не смотрит на строчное
      # `rusofasil` (ключи localStorage, телеграм-хэндлы объявлены в нём
      # адресами, а не именем), поэтому идентификатор сборки был слеп по
      # построению — это и был долг 70. Статический, базы не трогает.
      - name: Идентификатор приложения — один везде
        run: npm run check:app-id

      - name: Тот же сторож — позитивный контроль
        run: npm run check:app-id:plant

      # 0,5 с. Что код просит у устройства — то и объявлено в нативных
      # манифестах, и ничего сверх того. Долг 72: getUserMedia звался без
      # единого объявления разрешения, на iOS это завершение процесса, а
      # не отказ. В браузере не воспроизводится в принципе — там
      # разрешение спрашивает браузер, — поэтому проверка статическая и
      # читает манифесты, а не страницу.
      - name: Нативные разрешения объявлены ровно под то, что зовёт код
        run: npm run check:native-permissions

      - name: Тот же сторож — позитивный контроль
        run: npm run check:native-permissions:plant

      # 0,2 с. Ни одно число вводной деки не написано руками. Базы не
      # трогает вовсе — слайды строятся на подставных значениях, поэтому
      # пустая база CI ему безразлична (проверено прогоном на пустом
      # файле базы).
      - name: Числа вводной деки посчитаны, а не написаны
        run: npm run check:intro-numbers

      - name: Тот же сторож — позитивный контроль
        run: npm run check:intro-numbers:plant

      # 0,1 с. Контраст WCAG у 18 пар токенов и «premium не стоит на
      # кликабельном». Позитивного контроля у этой проверки нет вовсе
      # (слепая зона, названа в docs/audit-2026-09-08-B.md), поэтому её
      # зелёный здесь читать как «не покраснела», а не как «доказано».
      - name: Токены дизайна — контраст и признак платного
        run: npm run check:tokens

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Долг 59 (PROGRESS.md 7.134, часть 4): всякий POST, уходящий из
      # умирающего документа, обязан иметь свой маршрут в service worker.
      # Нарушение этого правила съедало у Chromium 6 и 8 доставок из 16.
      - name: POST из умирающего документа имеет маршрут в SW
        run: npm run check:dying-posts

      # Обязательная вторая половина: сторож, который не краснеет от
      # подсадки, зелёный ни о чём не говорит (PROGRESS.md 4.1).
      - name: Тот же сторож — позитивный контроль
        run: npm run check:dying-posts:plant

      # Сам `check:story-topics` здесь стоять НЕ может: база CI держит
      # ноль строк `Story`, и проверка о чипах каталога на пустом
      # каталоге вакуумна (она это и говорит вслух, красным). Поэтому в
      # CI стоит только её позитивный контроль: он идёт по ЗАВЕДОМО
      # здоровой выборке в памяти и базы не спрашивает вовсе, то есть
      # правило «чип темы, отдающий 0 карточек, — падение» здесь
      # проверяется целиком. Сама проверка — в `npm run verify` и в
      # списке исключений PROGRESS.md.
      - name: Чип темы с нулём карточек — падение (позитивный контроль)
        run: npm run check:story-topics:plant

      # Заход 7.150: у рассказа появилось испанское название. Здесь стоит
      # только позитивный контроль — база этой задачи пуста, а «нарушений
      # 0» на нуле строк правило 4.1 результатом не считает (проверка
      # честно краснеет строкой «в базе нет ни одного рассказа»). Контроль
      # идёт по заведомо здоровой выборке в памяти и базы не спрашивает:
      # семь подсадок, из них две — в САМО правило подачи (заморозка и
      # пропавший оригинал), потому что «замороженная страница получила
      # новую подачу» строкой данных не изображается. Сама проверка стоит
      # в задаче Playwright — там база держит фикстуру рассказов.
      - name: Испанское название рассказа — позитивный контроль сторожа
        run: npm run check:story-title-es:plant

      # The positive control for the Stripe env-shape guard. CI has no Stripe
      # variables at all, so the guard's real run here is vacuously green —
      # which is exactly the kind of green PROGRESS.md 4.1 says proves
      # nothing. This step plants eight malformed values and fails unless the
      # guard goes red on every one.
      - name: Stripe env guard — positive control
        run: npm run check:stripe-env:self-test

      # The same control for the AUTHENTICITY check (PROGRESS.md 7.66): the
      # shape guard above would have passed the real 2026-08-24 defect, which
      # was a properly formed Price id pointing at an ARCHIVED price. This
      # step plants an archived price, a nonexistent one, a wrong amount and a
      # wrong currency, and fails unless each is caught. No Stripe key is
      # needed: the single Stripe call is injected.
      - name: Stripe price authenticity — positive control
        run: npm run check:stripe-prices:self-test

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push database schema
        run: npx prisma db push

      # This job used to have no seed step, and said so at length: there was
      # no committed source of FlashcardCard content, re-running
      # generate:word-games against an empty bank writes zero puzzles, and
      # so e2e/word-games.spec.ts and e2e/glossary.spec.ts both self-skipped
      # under CI. The cost of that was 16 of the suite's tests — a third of
      # it — not running here while the job reported green.
      #
      # The fixture below is the answer, and it deliberately does NOT try to
      # rebuild the card bank: it loads four real WordGamePuzzle rows and
      # four real GlossaryTerm rows straight from e2e/fixtures/*.json. It
      # refuses to write to any database that already holds content it did
      # not put there, so it can only ever touch an empty CI one. See
      # PROGRESS.md 7.52 and the script's own header.
      #
      # Still true, and still worth knowing: lessons and exams pass here via
      # each feature's bundled content.json fallback, not via real seed
      # data. Everything else DB-backed is either seeded above or absent.
      - name: Seed the e2e content fixture
        run: npx tsx scripts/seed-e2e-fixture.mjs

      # Тот же сторож, но по НАСТОЯЩИМ строкам: фикстура выше держит три
      # рассказа — с испанским названием, без него и замороженный. Три
      # состояния подачи, то есть проверка здесь не вакуумна.
      - name: Испанское название рассказа — по строкам фикстуры
        run: npm run check:story-title-es

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Run Playwright tests
        run: npm run test:e2e

      # The gate that makes 30.08.2026 unrepeatable. A green Playwright exit
      # code says nothing about how many tests produced it: CI ran 25 of 49
      # and passed (PROGRESS.md 7.52). This reads the run's own report and
      # fails if anything skipped or if fewer tests executed than the suite
      # is known to have. `if: always()` because a run that fails AND quietly
      # shrank is the case where knowing matters most.
      - name: Check the e2e suite actually ran in full
        if: always()
        run: npm run check:e2e-coverage:run

      # Debt 19. lint, typecheck and 465 unit tests were green for the ten
      # days every lesson page on production rendered nothing but "Something
      # went wrong" (incident №1). None of them opens a browser. This step
      # does, and it is here rather than in a job of its own because this job
      # has already installed Chromium and already built the app — a separate
      # job would repeat npm ci, prisma generate, db push, the build and the
      # browser install to run a two-minute check.
      #
      # Only for main: on a pull request that targets main, and on a push to
      # main. Intermediate commits on a branch do not pay for it.
      #
      # The fixture is not optional. CI's database is empty (see the note
      # above), and with no glossary rows GlossaryText builds no pattern, so
      # incident №1 would not reproduce here even with the bug fully
      # present. The fixture puts back the one thing that made it fatal: a
      # term containing a hyphen.
      - name: Seed the render fixture
        if: github.event.pull_request.base.ref == 'main' || github.ref == 'refs/heads/main'
        timeout-minutes: 5
        run: npx tsx scripts/seed-ci-render-fixture.mjs

      # timeout-minutes is the fuse, not the fix. On 29.08.2026 this step
      # finished its work in a second and then hung for 56 minutes because
      # verify-rendered.mjs killed `npx` instead of the server npx had
      # started, and the surviving grandchild's inherited pipes kept the
      # process alive (see that file's header). That is fixed; this cap is
      # here so the NEXT way it could hang costs minutes instead of an hour.
      # The check itself takes about a minute, so 10 is generous.
      - name: Rendered surface (real browser, after hydration)
        if: github.event.pull_request.base.ref == 'main' || github.ref == 'refs/heads/main'
        timeout-minutes: 10
        run: npm run check:rendered:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
