name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch/PR makes the previous run's checks moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Real Postgres/MySQL-style envs aren't needed: the app runs on SQLite,
  # and CI only needs a schema to push migrations against, not real data.
  DATABASE_URL: "file:./dev.db"
  # Any fixed value works here — CI never needs to verify a real cookie
  # signed by a real deployment, only that signing/verification round-trips.
  SESSION_SECRET: "ci-test-secret-do-not-use-in-production"

jobs:
  test:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push database schema
        run: npx prisma db push

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push database schema
        run: npx prisma db push

      # No seed step here on purpose: `db push` only creates the schema, and
      # there is currently no committed source of FlashcardCard content (or
      # most other content tables) to load into it — everything is DB-backed
      # only, authored directly against dev.db/Turso, never as files in this
      # repo. This is why e2e/word-games.spec.ts self-skips under CI (see
      # its own top-of-file comment) — running `generate:word-games` here
      # was tried and confirmed to write zero puzzles against an empty
      # FlashcardCard table, so it isn't worth the CI minutes. Other
      # content-dependent tests that pass today do so via each feature's
      # own bundled content.json fallback (lessons/exams), not real seed
      # data — don't assume this job exercises the DB-backed content paths.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
