name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch/PR makes the previous run's checks moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Real Postgres/MySQL-style envs aren't needed: the app runs on SQLite,
  # and CI only needs a schema to push migrations against, not real data.
  DATABASE_URL: "file:./dev.db"
  # Any fixed value works here — CI never needs to verify a real cookie
  # signed by a real deployment, only that signing/verification round-trips.
  SESSION_SECRET: "ci-test-secret-do-not-use-in-production"

jobs:
  test:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push database schema
        run: npx prisma db push

      # Значок платности пишется в одном месте, а не пересказывается
      # (PROGRESS 7.137 часть 3). Дешёвая статическая проверка, поэтому
      # рядом с lint, а не в браузерной задаче.
      - name: Значок платности — один признак на весь сайт
        run: npm run check:access-marks

      - name: Тот же сторож — позитивный контроль
        run: npm run check:access-marks:plant

      # 7.212, решение владельца (вариант А). Закрытость выносит РОВНО
      # одна функция `isClosedFor`; до этого захода её решали три места и
      # каждое по-своему. Направление судит ИСХОДНИК, потому что на
      # экранах расхождение невидимо: каждое из трёх правил было
      # по-своему право. Браузера и сервера не требует.
      - name: Закрытость решается в одном месте
        run: npm run check:access-signs:static

      - name: Тот же сторож — подсадка в обе стороны
        run: npm run check:access-signs:static:plant

      # 7.213, долг 155. Язык, которым отвечать посетителю на адресе БЕЗ
      # локали, решает ОДНА функция, и её можно спросить таблицей значений
      # заголовка `Accept-Language`. До этого захода разбор жил приватным
      # внутри `src/proxy.ts` и не был накрыт ничем, а решение это
      # принимается для каждого адреса сайта. Ни сервера, ни браузера не
      # требует.
      - name: Язык по заголовку устройства — одна функция и таблица
        run: npm run check:device-locale

      - name: Тот же сторож — подсадка прежним разбором
        run: npm run check:device-locale:plant

      # 7.214, задача 1. ПОРЯДОК источников языка: запомненный выбор
      # (кука `rf-lang`) сильнее заголовка устройства, заголовок сильнее
      # молчаливого испанского. Сторож выше смотрит ТОЛЬКО заголовок и
      # про куку не знает вовсе. ПОПРАВКА 19.09.2026 (7.215, задача 2):
      # прежняя редакция этого комментария утверждала, что браузерная
      # проба 7.198 (`check:remembered-locale`) не стоит ни в verify, ни
      # здесь. Это неверно — её запускает обёртка
      # `scripts/verify-rendered.mjs`, а та стоит в обоих прогонах. Довод
      # в пользу отдельного сторожа от этого не исчезает: проба требует
      # поднятого сервера и настоящего браузера, а этот — ни сервера, ни
      # браузера не требует и потому гоняется на каждом коммите.
      - name: Запомненный выбор языка сильнее языка устройства
        run: npm run check:locale-priority

      - name: Тот же сторож — подсадка перевёрнутым порядком
        run: npm run check:locale-priority:plant

      # 7.213, долги 84, 85 и 86. Возврат денег приходит с одним ключом —
      # `PaymentIntent`, — и чтобы по нему нашлась строка доступа, платёж
      # обязан быть записан в момент оплаты. Потеря любой из девяти связей
      # молчалива: доступ выдан, вебхук ответил 200, а возврат через месяц
      # не находит ничего. Живого Stripe не требует.
      - name: Деньги вернулись — есть что отозвать
        run: npm run check:refund-trace

      - name: Тот же сторож — подсадка по каждой связи
        run: npm run check:refund-trace:plant

      # 7.196, часть 4. Дешёвая половина сторожа «на /ru нет испанского
      # текста»: она судит САМУ проверку — четыре настоящих строки,
      # снятых владельцем с экрана, обязаны быть пойманы, и пять русских
      # строк тех же мест обязаны пройти молча. Живая половина (браузером,
      # по каталогу рассказов и по всем десяти слайдам колоды) гоняется в
      # шаге «Rendered surface» на уже поднятом сервере.
      - name: На /ru нет испанского текста — позитивный и отрицательный контроль
        run: npm run check:ru-spanish:plant

      # Заход 7.153. Вторая половина того же правила: значок не только
      # пишется в одном месте, но и НЕ ОБЕЩАЕТ ОТКРЫТЫМ то, что закрыто.
      # Замер по настоящей базе 09.09.2026 нашёл ровно этот класс в окне
      # поиска: 2210 пазлов из 3277 и 4553 карточки из 5771 печатались
      # открытыми. Проверка сверяет пометку не тем же выражением, каким
      # она ставится, а правилом бесплатного образца
      # (`isFreeWordGamePuzzle`, `isFreeTrialLesson`, `MediaItem.free`,
      # `Story.isPremium`). Уроки и медиа читаются из словарей и JSON, а
      # не из базы, поэтому и на пустой базе CI множество не пусто —
      # проверка не вакуумна и это видно числом в её отчёте.
      - name: Значок не обещает открытым то, что закрыто
        run: npm run check:mark-truth

      - name: Тот же сторож — позитивный контроль
        run: npm run check:mark-truth:plant

      # 7.167. Переключатель языка в шапке до этого захода менял первый
      # сегмент пути и больше ничего: на 39 испанских страницах он вёл в
      # 404. Проверка статическая — ни сети, ни базы, поэтому на пустой
      # базе CI она полноценна.
      # 7.169, долг 129. У сайта появилась своя страница 404; живая
      # половина («каждый вид адреса-ошибки отдаёт 404 и нашу страницу»)
      # гоняется на поднятом сервере внутри check:rendered:ci, здесь —
      # статическая: конвенция global-not-found включена, документ на
      # месте, прокси кладёт локаль и переписывает испанские маршруты под
      # /ru, своего адреса у страницы нет. Ни сети, ни базы.
      - name: Страница 404 — своя, и её нельзя выключить молча
        run: npm run check:404

      - name: Тот же сторож — позитивный контроль
        run: npm run check:404:plant

      - name: Переключатель языка не ведёт на ошибку
        run: npm run check:locale-switch

      - name: Тот же сторож — позитивный контроль
        run: npm run check:locale-switch:plant

      # 7.167. «Антонимы» обещали описанием пары, а показывали список.
      - name: Раздел показывает то, что обещает о себе
        run: npm run check:section-truth

      - name: Тот же сторож — позитивный контроль
        run: npm run check:section-truth:plant

      # Ровно то, что 08.09.2026 позволило красному `npm run verify`
      # прожить на `main` незамеченным: check:brand входит в verify и не
      # входил сюда, и PR #220 прошёл CI зелёным с красной проверкой
      # внутри. Сторож ниже держит правило «команда verify обязана быть
      # либо здесь, либо в списке исключений PROGRESS.md с причиной».
      # 0,1 с — дешевле любой строки, которую он стережёт.
      - name: Каждая проверка verify стоит на пути мержа
        run: npm run check:ci-covers-verify

      - name: Тот же сторож — позитивный контроль
        run: npm run check:ci-covers-verify:plant

      # Заход 7.172, долг 135. Чтения боевой базы — бюджет: 11.09.2026
      # квота Turso кончилась и живой сайт лёг (500 у 330 замороженных
      # URL из 330). Один рендер медиа-страницы стоит 36 328 строк,
      # один прогон check:frozen — 7,3 млн, полный обход сайта — 21,9 млн.
      # Сторож держит правило «перепись работает по снимку; в боевую базу
      # — только с --against-prod и с печатью цены», а подсадка проверяет
      # обратную половину: запуск против прода без флага обязан отказать.
      # Сети не трогает: боевой адрес в подсадке заведомо несуществующий.
      - name: Тяжёлые переписи не ходят в прод молча
        run: npm run check:prod-reads

      - name: Тот же сторож — позитивный контроль
        run: npm run check:prod-reads:plant

      # Заход 7.161, долг 116. Класс отказа, который до сих пор не ловил
      # никто: на поверхности отрисован работающий орган «слушать», а
      # настоящей записи для него не отдано, и кнопка уходит в браузерный
      # синтез — системный голос ОС. Ровно так жил долг 114: бесплатный
      # отрывок 323 рассказов из 325 на живом проде читала системная
      # Milena. Здесь стоит подсадка (сети не требует, работает на пустой
      # базе CI); полный обход живых страниц — `check:silent-listen:prod`,
      # ему нужна работающая база, поэтому в CI его нет.
      - name: Кнопка «слушать» без записи — позитивный и отрицательный контроль
        run: npm run check:silent-listen:plant

      # Заход 7.163, тот же класс вне рассказов. Замер по боевой базе
      # 10.09.2026: 20 594 кнопки «слушать» на 17 поверхностях, у 2128 из
      # них записи не находилось, и 1031 из этих 2128 уже была оплачена —
      # тот же текст озвучен рядом. Заход 7.166 добавил восемнадцатую
      # поверхность — тап по слову ВНУТРИ рассказа (56 642 тапаемых места,
      # долг 123): до него там звучал браузерный голос у всех, включая
      # анонима на двух бесплатных рассказах. Здесь стоит подсадка
      # резолвера (сети и базы не требует); полная перепись —
      # `check:listen-buttons`, ей нужна боевая база, поэтому в CI её нет
      # (то же, что у долга 119).
      - name: Выбор клипа для кнопки «слушать» — позитивный и отрицательный контроль
        run: npm run check:listen-buttons:plant

      # Заход 7.168. Пять заходов подряд закрывали один класс: орган
      # «слушать» есть, записи нет, и вместо неё звучал системный голос
      # ОС. С 7.168 подменять запись нечем — браузерного синтеза нет в
      # коде вовсе. Раньше это держалось уговором, и уговор уже один раз
      # не сработал: `no-runtime-tts.test.ts` существовал с 7.163 и этого
      # класса не видел вовсе (все четыре его правила — про платный вызов
      # OpenAI, на 36 строках браузерного синтеза 0 совпадений). Здесь
      # половина по исходникам: комментарии и строки снимаются, ищется
      # КОД. Вторая половина — по собранным бандлам, сразу после сборки.
      # Заход 7.173, долг 135. Индекса на `AudioAsset.text` не было, и
      # один холодный рендер медиа-страницы доставал 6 строк, прочитав
      # 36 316: месячная квота чтений Turso кончилась, сайт отдавал 500
      # у 330 замороженных URL из 330. Проверка смотрит не схему, а ПЛАН
      # двух настоящих запросов продукта на базе в форме CI: индекс,
      # объявленный в схеме, — это ещё не индекс, который берётся
      # (чужая сортировка, форма запроса, недоставка на прод).
      # 7.199, часть 1. Перепись тем словаря спрашивается одним местом, и
      # это место умеет отменять запрос: четыре одинаковых эффекта без
      # признака отмены и дали гонку разрезов, из-за которой на уровне C1
      # «Продолжить» показывало слова разреза «все уровни», а числа на
      # плитках превращались в вечную заглушку. Поведение на быстром
      # переключении уровней проверяет стенд в `npm run test`
      # (`src/components/flashcards/level-race.test.tsx`), здесь — форма
      # кода, из-за которой поведение было таким.
      - name: Перепись словаря спрашивается одним отменяемым местом
        run: npm run check:summary-race

      - name: Тот же сторож — позитивный контроль
        run: npm run check:summary-race:plant

      - name: Индекс на AudioAsset.text берётся планом
        run: npm run check:text-index

      - name: Тот же сторож — позитивный контроль (индекса нет / чужая сортировка)
        run: npm run check:text-index:plant

      - name: Браузерного синтеза нет в исходниках
        run: npm run check:no-runtime-tts

      - name: Тот же сторож — позитивный контроль
        run: npm run check:no-runtime-tts:plant

      # Долг 152 (заход 7.187). Нативная медиа-сессия была написана в
      # 7.157 и не выполнялась НИ РАЗУ: все её вызовы стояли внутри
      # эффектов, открытых сторожем `"mediaSession" in navigator`, — то
      # есть за проверкой ровно того веб-API, отсутствие которого они и
      # лечат (в Android System WebView его нет, замерено на живом
      # телефоне 12.09.2026). Сторож статический, базы не трогает.
      - name: Нативная медиа-сессия не заперта веб-сторожем
        run: npm run check:native-media-session

      - name: Тот же сторож — позитивный контроль (вызов возвращён за сторож)
        run: npm run check:native-media-session:plant

      # Долг 158 (заход 7.187). Тап по слову звал обработчик ПРЕДЛОЖЕНИЯ
      # вдобавок к карточке перевода — то есть перематывал чтение на
      # начало предложения и продолжал читать; нажатая следом 🔊 давала
      # два голоса сразу. Поведение заперто юнит-тестами
      # (StoryText.word-tap-pause.test.tsx, там же позитивный контроль
      # самого счётчика наложений); здесь — структура из четырёх мест.
      - name: Тап по слову ставит рассказ на паузу и возвращает его
        run: npm run check:word-tap-pause

      - name: Тот же сторож — позитивный контроль (пять подсадок на живом файле)
        run: npm run check:word-tap-pause:plant

      # Долги 169 и 168 (заход 7.188). Перевод по тапу жил чужой суточной
      # квотой (≈916 тапов НА ВЕСЬ САЙТ), а отказ этого сервиса приходил
      # с HTTP 200 английской строкой «MYMEMORY WARNING…» и вставал в
      # карточку как перевод. Поведение заперто юнит-тестами
      # (StoryText.tap-cost.test.tsx считает запросы на тап,
      # mymemory-refusal.test.ts разбирает настоящий отказ); здесь —
      # структура: порядок источников, разбор отказа, честный кэш,
      # адрес предзагрузки, не умеющий ходить наружу.
      - name: Свой банк перед чужим сервисом, отказ сервиса не виден ученику
        run: npm run check:translate-bank

      - name: Тот же сторож — позитивный контроль (одиннадцать подсадок на живых файлах)
        run: npm run check:translate-bank:plant

      # Долг 157 (заход 7.187). Календарь считал пропуски от ДАТЫ
      # РЕГИСТРАЦИИ: учётная запись, заведённая 26.08 и ни разу не
      # занимавшаяся, к 12.09 показывала 18 холодных значков подряд при
      # серии 0. Решение владельца — считать с первого ЗАНЯТИЯ.
      # Арифметика сетки закрыта юнит-тестами; здесь — то, что именно
      # передаёт в неё страница профиля (в jsdom она не рендерится).
      - name: Пропуски в календаре считаются с первого занятия
        run: npm run check:calendar-misses

      - name: Тот же сторож — позитивный контроль (дата регистрации подсажена обратно)
        run: npm run check:calendar-misses:plant

      # Долг 203. Бейдж на иконке приложения не сбрасывался, если человек
      # открыл приложение С ИКОНКИ, а не нажатием на уведомление: вызовов
      # removeAllDeliveredNotifications() во всём src/ было 0, и на
      # возобновление приложения не был подписан никто.
      - name: Бейдж снимается и при открытии с иконки
        run: npm run check:notification-badge

      - name: Тот же сторож — позитивный контроль (снятие бейджа убрано)
        run: npm run check:notification-badge:plant

      # Долг 212. Под медленным 3G заглушка кабинета занимала 0 px почти
      # четыре секунды: высота бралась только из классов Tailwind, а вторая
      # таблица стилей приходит через 3645 мс после подвала. Замер без
      # стилей: 0 px -> 452 px, блоков нулевой высоты 17 из 17 -> 0 из 17.
      - name: У заглушки кабинета есть своя высота
        run: npm run check:skeleton-height

      - name: Тот же сторож — позитивный контроль (высоты сняты)
        run: npm run check:skeleton-height:plant

      # Долг 209. Колода на экране говорит на языке интерфейса с 7.196, а
      # PDF оставался испанским целиком — обложка, «Diapositiva N de M»,
      # название документа и префикс ссылок /es.
      - name: PDF вводной презентации говорит на языке локали
        run: npm run check:intro-pdf-locale

      - name: Тот же сторож — позитивный контроль (русская рамка подменена испанской)
        run: npm run check:intro-pdf-locale:plant

      # Замер 19.09.2026 (7.216), 24 точки: показ плавающей кнопки Telegram
      # зависит ТОЛЬКО от темы («чтение» — нет в разметке вовсе) и от
      # ширины окна (видна с 1280). Ни роли, ни входа в условии нет — и
      # сторож держит именно это, чтобы наблюдение «под аккаунтом кнопки
      # нет» впредь не читалось как поломка.
      - name: Кнопка Telegram — правило показа
        run: npm run check:telegram-button

      - name: Тот же сторож — позитивный контроль (показ привязан ко входу)
        run: npm run check:telegram-button:plant

      # ЗАХОД 7.217 — ПЯТЬ СНЯТЫХ СТРОК ДОЛГОВ. Каждый сторож ниже стоит и
      # в `npm run verify`, и здесь: закрытие долга без обеих половин — не
      # закрытие, а обещание.

      # Долг 23. Интерфейсные строки жили в ДВУХ местах: словари и
      # src/lib/ui-strings.ts литералами. Теперь место одно — ветка
      # `clientUi` словарей, — а клиентский модуль её отпечаток.
      - name: У интерфейсной строки один источник
        run: npm run check:ui-strings-source

      - name: Тот же сторож — позитивный контроль (второе место вернулось)
        run: npm run check:ui-strings-source:plant

      # Долг 102. Подпись тарифа называла того, кто строку СОЗДАЛ: месяц,
      # оплаченный через OXXO поверх ручной выдачи, оставался подписан
      # выдачей — то есть не попадал в историю платежей.
      - name: Подпись тарифа называет последнее событие
        run: npm run check:plan-signature

      - name: Тот же сторож — позитивный контроль (подпись снова от создателя)
        run: npm run check:plan-signature:plant

      # Долг 103. Отказ `unknown` от опечатки и отказ `unknown` от
      # невидимого знака были неразличимы в отчётах Sentry.
      - name: Отказ в погашении кода называет, что убрала нормализация
        run: npm run check:redeem-normalization

      - name: Тот же сторож — позитивный контроль (признак снова молчит)
        run: npm run check:redeem-normalization:plant

      # Долг 227. Гейт кабинета судил только подпись токена: человек,
      # нажавший «выйти на других устройствах», на старом устройстве всё
      # ещё получал документ кабинета и уходил на вход через секунду.
      - name: Ни один гейт не судит по одной подписи токена
        run: npm run check:session-version-gate

      - name: Тот же сторож — позитивный контроль (гейт снова слеп к отзыву)
        run: npm run check:session-version-gate:plant

      # Долг 83. В манифесте не было семи полей, и он был один на обе
      # локали: русская карточка установки показывала испанское описание.
      - name: Манифест PWA обещает то, что есть
        run: npm run check:pwa-manifest

      - name: Тот же сторож — позитивный контроль (поле снова пропало)
        run: npm run check:pwa-manifest:plant

      # Долг 118. `check:no-runtime-tts` читает исходники, `check:silent-listen`
      # читает разметку; ни один не знает, заговорил ли кто-нибудь. Живая
      # проба e2e/no-browser-voice.spec.ts считает вызовы синтеза, а этот
      # сторож держит её форму — она сама в `verify` не входит.
      - name: Живая проба «синтез не заговорил» цела
        run: npm run check:browser-voice-probe

      - name: Тот же сторож — позитивный контроль (у пробы снят контроль прибора)
        run: npm run check:browser-voice-probe:plant

      # Долги 75, 76, 77. Потолки кешей воркера приходили из node_modules,
      # документы делили тридцать две записи со статикой, а маршрут клипов
      # не срабатывал вовсе: RegExpRoute не применяет регулярку к чужому
      # адресу, если совпадение начинается не с нулевого символа.
      - name: У каждого вида содержимого свой кеш со своим потолком
        run: npm run check:sw-cache-policy

      - name: Тот же сторож — позитивный контроль (потолок снова чужой)
        run: npm run check:sw-cache-policy:plant

      # Заход 7.218. Владелец 20.09.2026 при ЖИВОЙ сети увидел экран
      # «Estás sin conexión — Вы не в сети»: и показан он был зря, и
      # говорил сразу на двух языках.
      - name: Офлайн-заглушка говорит на одном языке
        run: npm run check:offline-screen

      - name: Тот же сторож — позитивный контроль (заголовок снова двуязычный)
        run: npm run check:offline-screen:plant

      # Заход 7.218. Кнопка «выйти на остальных устройствах» была
      # навигацией на служебный адрес: потерянный ответ означал выход из
      # аккаунта на ТОМ САМОМ устройстве, которое подпись обещает не
      # трогать.
      - name: «Выйти на остальных устройствах» не уводит браузер
        run: npm run check:logout-everywhere

      - name: Тот же сторож — позитивный контроль (кнопка снова навигация)
        run: npm run check:logout-everywhere:plant

      # Долг 89, остаток. Экрана отзыва кодов в /admin не было, и
      # revokeAccessCode принимал `null` исполнителем: отозванный код без
      # подписи о том, кто его отозвал.
      - name: Отзыв кода доступа всегда подписан
        run: npm run check:access-code-revoke

      - name: Тот же сторож — позитивный контроль (исполнитель снова может быть пустым)
        run: npm run check:access-code-revoke:plant

      # Долг 68. Сверка прода смотрела только НАЛИЧИЕ колонки; расширение
      # до notnull/dflt_value/type написано ещё в aa9af9b, но на пути мержа
      # не стояло. В `verify` не входит намеренно — причина во ВТОРОМ
      # списке исключений PROGRESS.md: локальная dev.db у разработчика
      # живёт своей жизнью, а здесь база поднята `prisma db push` прямо из
      # схемы. Отдельно: сверка теперь ОТКАЗЫВАЕТ, если осмотрела 0 таблиц.
      - name: Схема против настоящей базы — тип, nullability, дефолт
        run: npm run check:schema-drift

      - name: Тот же сторож — позитивный контроль (расхождения подсажены)
        run: npm run check:schema-drift:plant

      # Решение владельца 17.09.2026 (заход 7.204): день занятия ставит
      # ДЕЙСТВИЕ, а не открытие страницы. На видео 17.09 бесплатному
      # аккаунту записался полный день за одно открытие словаря, без
      # единой отвеченной карточки. Сторож двусторонний: ни одна
      # страница день не ставит, и каждое действие из списка владельца
      # ставит его само.
      - name: День занятия ставит действие, а не открытие страницы
        run: npm run check:study-day-action

      - name: Тот же сторож — позитивный контроль (отметка подсажена на открытие словаря)
        run: npm run check:study-day-action:plant

      # Долг 223. Приветствие дня считало сутки по Гринвичу и держало
      # отметку в localStorage, которую чистит выход из аккаунта, —
      # владелец получил его дважды за один местный день.
      - name: Приветствие дня — один раз в сутки ученика
        run: npm run check:welcome-once

      - name: Тот же сторож — позитивный контроль (сутки по Гринвичу подсажены обратно)
        run: npm run check:welcome-once:plant

      # Долг 239. Выданный доступ (код-приглашение или ручная выдача) —
      # не покупка: отменять его нечем, кассы за ним нет, и платежом он
      # не называется. Заодно безусловное правило: ссылки на портал
      # платёжной системы нет НИГДЕ — внутри оболочки это отклонение по
      # политике магазина.
      - name: Выданный доступ — не покупка
        run: npm run check:grant-not-a-purchase

      - name: Тот же сторож — позитивный контроль (кнопка отмены подсажена обратно)
        run: npm run check:grant-not-a-purchase:plant

      # Долг 240. «Доступно» означало «пускает уровень», а не «человек
      # может открыть»: бесплатному аккаунту печаталось 4783 слова при
      # 230 настоящих (замер боевого банка 17.09.2026).
      - name: «Доступно» — это то, что можно открыть
        run: npm run check:available-words

      - name: Тот же сторож — позитивный контроль (прежний знаменатель подсажен обратно)
        run: npm run check:available-words:plant

      # Долг 241. После нажатия «Iniciar sesión» экран около трёх секунд
      # не менялся ничем: ни блокировки кнопки, ни надписи. Поведение
      # заперто в e2e/login-loading-state.spec.ts, здесь — механизм и то,
      # что он подключён к каждой из трёх форм.
      - name: У входа есть признак загрузки
        run: npm run check:auth-pending

      - name: Тот же сторож — позитивный контроль (голая кнопка подсажена обратно)
        run: npm run check:auth-pending:plant

      # Долги 224 и 231, один класс: счётчик печатал «0», когда числа
      # ещё не знал («0 palabras» на 23 плитках словаря, «Aprendidas:
      # 0 de 0» на идиомах). Настоящий ноль по-прежнему печатается
      # числом — сторож судит готовность ответа, а не величину.
      - name: Заглушка вместо нуля, пока данных нет
        run: npm run check:zero-placeholder

      - name: Тот же сторож — позитивный контроль (ноль до загрузки подсажен обратно)
        run: npm run check:zero-placeholder:plant

      # Просмотр назад `(?<=`/`(?<!` в регулярке — второй способ сделать
      # то же, что авария 29.08.2026: страница отдаётся с кодом 200 и
      # полным HTML, а в браузере гибнет после гидрации. Возможность
      # ES2018, и её нет ни в одном браузере на iOS до Safari 16.4
      # (март 2023): `new RegExp` там бросает SyntaxError на построении.
      - name: В `src/` нет просмотра назад
        run: npm run check:no-lookbehind

      - name: Тот же сторож — позитивный контроль (просмотр назад подсажен обратно)
        run: npm run check:no-lookbehind:plant

      # Долги 261, 262 и 263 (заход 7.211). Отказ хранилища браузера —
      # не исключительная ситуация, а обычная: приватное окно, запрет
      # данных сайта, политика устройства, переполнение квоты. В
      # браузере с запрещёнными данными бросает САМО обращение к
      # свойству, до `getItem`, и бросок в эффекте на монтировании
      # (`ExercisesTab.tsx:92`) отдавал страницу урока границе ошибок
      # при коде ответа 200. Решение одно и живёт в одном файле —
      # `src/lib/safe-storage.ts`; сторож не пускает второе.
      - name: Хранилище браузера трогает только обёртка
        run: npm run check:storage-guarded

      - name: Тот же сторож — позитивный контроль (голое обращение подсажено обратно)
        run: npm run check:storage-guarded:plant

      # Задача 3.1 захода 7.211. Владелец снял на живом телефоне чип
      # «caso vocativo (звательный падеж)» в ИСПАНСКОЙ локали: русская
      # подпись внутри испанского названия термина. Класс тот же, что у
      # `Story.author` — смешение языков живёт в ДАННЫХ, а не в
      # отрисовке. Сторож читает данные глоссария и витрины словаря
      # интерфейса; боевой базы ему не нужно.
      - name: Смешения языков в данных нет
        run: npm run check:locale-mixing

      - name: Тот же сторож — позитивный контроль (русская подпись подсажена обратно)
        run: npm run check:locale-mixing:plant

      # Задача 1 захода 7.215, правило 267 — РЕШЕНИЕ ВЛАДЕЛЬЦА от
      # 19.09.2026 (вариант Б развилки 7.212, часть 3.1). В локали `/ru`
      # главным названием термина печатается РУССКИЙ эквивалент,
      # испанское идёт второй строкой; в `/es` — наоборот. Сторож
      # двусторонний намеренно: односторонний («на /ru всё русское»)
      # прошёл бы и у правила, которое отдаёт русское имя ВЕЗДЕ, то есть
      # ломает испанскую локаль целиком. Ни сервера, ни браузера, ни
      # боевой базы не требует: данные читаются из модуля
      # `prisma/glossary-terms-data.ts`, витрины — из исходников.
      - name: Главное название термина зависит от локали
        run: npm run check:term-name

      - name: Тот же сторож — подсадка перевёрнутыми локалями
        run: npm run check:term-name:plant

      # 7.215, задача 2. Сторож написан 29.08.2026 и до сегодня не стоял
      # НИ В ОДНОМ прогоне — то есть исполнялся ноль раз. Он закрывает
      # случай, который однажды уже случился: `prisma/ensure-schema-sync.ts`
      # запускал мигратор просто от того, что его импортировали, и прогон
      # тестов в оболочке с боевыми ключами навёл мигратор на ПРОД.
      # Подсадка у него ВСТРОЕННАЯ и обязательная: прежде чем поверить
      # нулю соединений, он поднимает местный сокет и доказывает, что
      # умеет увидеть соединение (требует не меньше двух пойманных).
      # Цена — один дополнительный прогон набора, 50 с на ноутбуке.
      - name: Набор тестов не открывает ни одного соединения с базой
        run: npm run check:no-db-in-tests

      # Долг 164 (заход 7.187). Ссылка сброса пароля несла действующий
      # токен в СТРОКЕ ЗАПРОСА, а браузерный SDK Sentry прикладывает
      # полный адрес страницы к каждому событию: одна ошибка на той
      # странице — и токен в чужом хранилище. Тем же способом уезжал
      # токен подтверждения удаления учётной записи. Теперь оба едут во
      # фрагменте, который на сервер не уходит вовсе и стирается из
      # адреса сразу после чтения; вторая стена — чистка адресов в обеих
      # точках Sentry. Сторож статический, базы не трогает.
      - name: Одноразовый токен не стоит в строке запроса
        run: npm run check:reset-token

      - name: Тот же сторож — позитивный контроль (одиннадцать подсадок)
        run: npm run check:reset-token:plant

      # Долг 167 (заход 7.187). Уборка записей голоса при удалении
      # учётной записи была завёрнута в молчаливый catch, а второй путь
      # удаления (prisma/delete-test-accounts.ts) про хранилище не знал
      # вовсе — отсюда три объекта, пережившие своих владельцев.
      # В CI гоняется СТАТИЧЕСКАЯ половина (боевых ключей здесь нет и
      # быть не должно): оба пути зовут одну уборку, молчаливого catch
      # нет, порядок «объекты → строка» соблюдён. Живая половина —
      # `npm run check:blob-orphans:live`, у владельца с ключами; она
      # печатает, что пропущена, а не молчит об этом.
      - name: Уборка записей голоса не может не случиться молча
        run: npm run check:blob-orphans

      - name: Тот же сторож — позитивный контроль (десять подсадок, включая поиск сироты)
        run: npm run check:blob-orphans:plant

      # Заход 7.168. Поверхностей со звуком восемнадцать, и до этого
      # захода ни один документ не говорил, чем каждая озвучивается, —
      # поэтому каждая дыра находилась замером, а не правилом. Паспорт
      # `docs/audio-passport.md` это говорит; сторож следит, что он не
      # разошёлся с продуктом. Статический, базы не трогает.
      - name: Каждая поверхность со звуком описана паспортом озвучки
        run: npm run check:audio-passport

      - name: Тот же сторож — позитивный контроль
        run: npm run check:audio-passport:plant

      # Долг 136: скрипт синтеза 7.171 заказывал запись голосом из ЯРЛЫКА
      # ЖУРНАЛА 7.168, а не из колонки `AudioAsset.voice` предложения.
      # Ярлык — снимок каста на момент написания журнала: у 16
      # предложений из 904 он разошёлся с колонкой, и шесть записей вышли
      # не тем голосом, каким читается само предложение. Сторож
      # статический, базы не трогает.
      - name: Голос синтеза берётся только из колонки AudioAsset.voice
        run: npm run check:synth-voice-source

      - name: Тот же сторож — позитивный контроль
        run: npm run check:synth-voice-source:plant

      # Долг критического пути цели A, первый: решение «есть ли доступ»
      # принимается в ОДНОМ месте. Окно C намерило 7 мест вне модуля плюс
      # 3 копии правила внутри него; после правки — 0 и 1. Проверка
      # статическая, базы не трогает, 0,1 с.
      - name: Решение о доступе принимается в одном месте
        run: npm run check:entitlement-point

      - name: Тот же сторож — позитивный контроль
        run: npm run check:entitlement-point:plant

      # Заход 7.146: коды доступа для первых учеников. Правило то же, что у
      # сторожа выше, и заведено оно ровно потому, что коды — первая с 7.145
      # функция, которая ВЫДАЁТ доступ: таблица AccessCode читается только из
      # своего модуля, выдача идёт общей `extendOrGrantSubscription`, а флага
      # доступа на User нет. Статическая, базы не трогает, 0,1 с.
      - name: Код доступа не создаёт второго пути к доступу
        run: npm run check:access-code-path

      - name: Тот же сторож — позитивный контроль
        run: npm run check:access-code-path:plant

      # Заход 7.148. Базу прогона e2e трогает ровно один процесс — сервер.
      # Правило вывели числами ещё в 7.134 (долг 58), но жило оно только в
      # комментарии одного маршрута, и хватило его ровно на один заход: 7.147
      # завела коды доступа отдельным процессом под `tsx`, и полный прогон в
      # форме CI дал 2 падения + 2 flaky, ни одно из которых не было в том
      # тесте, который писал. Статическая, базы не трогает, 0,1 с.
      - name: Базу прогона e2e пишет только сервер
        run: npm run check:e2e-single-writer

      - name: Тот же сторож — позитивный контроль
        run: npm run check:e2e-single-writer:plant

      # Заход 7.149, долги 94 и 95. Проба обязана уметь покраснеть. Класс
      # найден случайно в 7.147 (ожидание увода на /pricing, которого
      # страница не делает уже давно — условие было истинно всегда), и
      # подсадкой этого захода найдено девять таких проб. Механическую
      # половину класса сторож держит статически: мёртвый селектор класса,
      # селектор, доказанный только отрицанием, тест без единого
      # утверждения, `expect(x.every(...))` на возможно пустом списке и
      # тест, чей бюджет меньше суммы его собственных ожиданий (долг 95).
      # Базы не трогает, 0,3 с.
      - name: Проба обязана уметь покраснеть
        run: npm run check:e2e-live-probes

      - name: Тот же сторож — позитивный контроль
        run: npm run check:e2e-live-probes:plant

      # Заход 7.147, долг 91. Сырой SQL не сравнивает колонку DateTime и не
      # пишет её мимо формата Prisma. Правило выросло из находки 7.146:
      # Prisma хранит DateTime ТЕКСТОМ, и строка, положенная сырым клиентом
      # числом миллисекунд, ломает сравнение в SQL — живой код доступа
      # выглядел неизвестным. Статическая, базы не трогает, 0,3 с.
      - name: Сырой SQL не решает вопросов о времени за Prisma
        run: npm run check:raw-datetime

      - name: Тот же сторож — позитивный контроль
        run: npm run check:raw-datetime:plant

      # 0,4 с. Политика конфиденциальности и условия обязаны совпадать с
      # кодом: запись голоса никуда не отправляется — значит текст не имеет
      # права обещать её хранение (долг 73); и наоборот, новый внешний
      # обработчик обязан быть назван в обеих локалях (долг 74).
      - name: Политика совпадает с кодом
        run: npm run check:legal-truth

      - name: Тот же сторож — позитивный контроль
        run: npm run check:legal-truth:plant

      # 0,3 с. ОРФОГРАФИЯ И ТИПОГРАФИКА ИСПАНСКОГО ТЕКСТА ДВУХ ДОКУМЕНТОВ
      # (заход 7.202, часть 4). Владелец прочитал `/es/terms` на телефоне и
      # назвал четыре места; три из них в репозитории были («idioms» вместо
      # «modismos», слипшееся «cámbiala contraseña», прямые кавычки), а
      # четвёртое — «tu pais» — опровергнуто числом: 0 вхождений, слово
      # `país` встречается четырежды и все четыре раза с ударением. Правило
      # про кавычки общее, два других — списком, и сторож этим не
      # притворяется спеллчекером. Русский текст не судится вовсе.
      - name: Испанский текст условий и политики — кавычки и орфография
        run: npm run check:legal-es-text

      - name: Тот же сторож — позитивный контроль (4 подсадки из 7 — настоящие строки до правки)
        run: npm run check:legal-es-text:plant

      # 0,3 с. КАБИНЕТ ГОВОРИТ О ПЛАНЕ ОДНО И ТО ЖЕ (заход 7.202, части 2,
      # 3 и 5). У сотрудника «Обзор» писал «Бесплатный план», а вкладка
      # «Подписка» — «Полный доступ»: долг 221 завёл признак `staffAccess` и
      # применил его ровно в одном из двух бейджей. Сюда же: блок «Код
      # доступа», предлагавшийся тому, у кого доступ уже полный (маршрут
      # погашения отказывает при tier !== "free"), образец настоящей
      # приставки выпуска в подсказке поля и прогресс значков серии, который
      # считает ЛУЧШУЮ серию под подписью про дни подряд.
      #
      # Положительный контроль — не подсадка, а НАСТОЯЩИЙ код 4884a6e, тот
      # самый, на котором владелец снял все три находки.
      - name: Кабинет называет план одинаково на всех вкладках
        run: npm run check:cabinet-plan-truth

      - name: Тот же сторож — позитивный контроль
        run: npm run check:cabinet-plan-truth:plant

      # 0,4 с. ДОЛГ 228, решение владельца 16.09.2026: приглашение погасить
      # код доступа видит только аккаунт БЕЗ действующего доступа. Сторож
      # двусторонний и первую половину ИСПОЛНЯЕТ: настоящее правило
      # прогоняется по всем трём разрядам (free — показать, standard и
      # premium — скрыть), вторая половина требует, чтобы кабинет и маршрут
      # погашения спрашивали одну и ту же функцию, а не два похожих
      # выражения. Разряд отменённой-но-действующей подписки закрыт
      # прогоном src/lib/access-code-offer.test.ts (subscription.ts
      # серверный и под tsx не импортируется).
      - name: Поле кода доступа предлагается только тому, кто может им воспользоваться
        run: npm run check:access-code-offer

      - name: Тот же сторож — позитивный контроль
        run: npm run check:access-code-offer:plant

      # 0,2 с. Текст интерфейса: ни «zorra» (в Мексике это оскорбление
      # женщины, а не название животного), ни внутреннего имени палитры
      # «Gorodets»/«Городецкая роспись» в подписях, которые читает человек.
      # Вторая половина — названные подписи обязаны существовать и быть
      # непустыми: правило «слова нет» не выполняется удалением текста.
      # Учебное содержимое (сказки, басни) не судится намеренно, и число
      # его вхождений печатается в отчёте.
      - name: Текст интерфейса не оскорбляет и не говорит внутренними именами
        run: npm run check:ui-wording

      - name: Тот же сторож — позитивный контроль
        run: npm run check:ui-wording:plant

      # 0,6 с. Три законных написания имени — и ни одного четвёртого:
      # RusoFácilapp (сайт), RusoFácil (витрина обеих платформ и имя
      # разработчика в Play), com.rusofacilapp.app (идентификатор). Сюда же
      # сведены пять литералов витринного имени: Xcode и Gradle читают свои
      # файлы, одной точки правды для них не существует.
      # 7.205, часть 2. Адрес доступности `/api/health` обязан остаться
      # дешёвым (`SELECT 1`, замерено на боевой базе: rows_read = 0),
      # немым (ни авторизации, ни личных данных, ни текста исключения
      # драйвера) и невидимым для поиска. Дешёвая статическая проверка —
      # базы не открывает вовсе, поэтому стоит здесь, а не в браузерном
      # задании. САМ прогон по живому проду здесь не гоняется и гоняться
      # не может: на PR прода ещё нет — он в отдельном workflow
      # prod-smoke.yml.
      - name: Адрес доступности дёшев, нем и не индексируется
        run: npm run check:health-route

      - name: Тот же сторож — позитивный контроль
        run: npm run check:health-route:plant

      - name: Имя бренда пишется одинаково
        run: npm run check:brand

      - name: Тот же сторож — позитивный контроль
        run: npm run check:brand:plant

      # 0,2 с. Сводка таблицы долгов: сумма категорий обязана сходиться с
      # числом строк, иначе долг молча выпадает из счёта.
      - name: Сводка таблицы долгов сходится
        run: npm run count:debts

      - name: Тот же сторож — позитивный контроль
        run: npm run count:debts:plant

      # 0,3 с. Личность нативной сборки — одна и та же во всех местах, где
      # она объявлена. Отдельный сторож, а не расширение check:brand:
      # тот регистрозависим и намеренно не смотрит на строчное
      # `rusofasil` (ключи localStorage, телеграм-хэндлы объявлены в нём
      # адресами, а не именем), поэтому идентификатор сборки был слеп по
      # построению — это и был долг 70. Статический, базы не трогает.
      - name: Идентификатор приложения — один везде
        run: npm run check:app-id

      - name: Тот же сторож — позитивный контроль
        run: npm run check:app-id:plant

      # 3 с. ЗАХОД 7.191, долг 177. Иконка приложения обязана происходить
      # от `resources/icon.png`. Долг прожил от первого `npx cap add` до
      # 13.09.2026 и не был виден ни одной проверке: картинки на месте,
      # размеры правильные, сборка зелёная — а знак чужой, дефолтный от
      # Capacitor. Сторож двусторонний: все 25 файлов пересчитываются
      # заново из источника и сличаются побайтово (эталон нигде не
      # хранится — хранимый снимок был бы вторым источником правды), и
      # отдельно, не выводимо из первого, ищется дефолт поимённо —
      # `#3730a3`/`#d97706` в углах, включая углы самого источника.
      # Сборки APK не требует: ключа подписи в CI нет, и слой пакета
      # закрыт замером захода, а не этим шагом.
      - name: Иконка приложения происходит от фирменного знака
        run: npm run check:app-icons

      - name: Тот же сторож — позитивный контроль
        run: npm run check:app-icons:plant

      # 0,6 с. ЗАСТАВКА (заход 7.197). Тот же класс отказа, что у иконки
      # выше, и та же цена: настроенным выглядело, а на экране телефона
      # не было ничего. Сторож судит четыре файла сразу — тему запуска,
      # конфиг оболочки, MainActivity и цвет, — потому что заставка
      # ломается ровно на стыках между ними, а не внутри одного.
      # Картинки, как и у иконки, пересчитываются из resources/icon.png и
      # сличаются побайтово.
      - name: Заставка есть, фирменная, уходит по событию, а не по таймеру
        run: npm run check:splash

      - name: Тот же сторож — позитивный контроль
        run: npm run check:splash:plant

      # 0,4 с. ОБОЛОЧКА: СЕССИЯ И ЯЗЫК (заход 7.198, части 1 и 3). Две
      # жалобы с живого телефона, у обеих причина вне сайта. Первая:
      # выход из аккаунта не переживал закрытия приложения из «Недавних» —
      # удаление куки оставалось в памяти webview, а на диск Chromium
      # пишет хранилище кук пачками, и Capacitor 8.5.0 не зовёт
      # `CookieManager.flush()` в жизненном цикле НИ РАЗУ. Вторая: экран
      # ошибки оболочки приходил на языке ТЕЛЕФОНА, потому что выбор
      # языка живёт на боевом источнике, а сам экран — на локальном.
      #
      # Положительный контроль у этого сторожа не подсадка, а НАСТОЯЩИЙ
      # файл из origin/main — тот, на котором снят замер владельца.
      - name: Выход из аккаунта и язык оболочки переживают закрытие
        run: npm run check:shell-session-locale

      - name: Тот же сторож — позитивный контроль
        run: npm run check:shell-session-locale:plant

      # 0,5 с. Что код просит у устройства — то и объявлено в нативных
      # манифестах, и ничего сверх того. Долг 72: getUserMedia звался без
      # единого объявления разрешения, на iOS это завершение процесса, а
      # не отказ. В браузере не воспроизводится в принципе — там
      # разрешение спрашивает браузер, — поэтому проверка статическая и
      # читает манифесты, а не страницу.
      - name: Нативные разрешения объявлены ровно под то, что зовёт код
        run: npm run check:native-permissions

      - name: Тот же сторож — позитивный контроль
        run: npm run check:native-permissions:plant

      # 0,1 с. ЗАХОД 7.189, часть 2. Оболочка обязана уметь объяснить свою
      # неудачу: `errorPath` объявлен, у кнопки «Повторить» написан боевой
      # адрес (а не `location.reload()`, который перезагружал сам экран
      # ошибки), в `MainActivity.java` стоит сторож загрузки со сроком — и
      # все три конфигурации Sentry ставят метку оболочки, без которой
      # ошибка с телефона неотличима от ошибки в мобильном браузере.
      # Живую половину — «оболочка действительно показала страницу, а не
      # пустоту» — гоняет `scripts/check-native-shell-render.mjs` в шаге
      # «Rendered surface» на уже поднятом сервере.
      - name: Оболочка умеет объяснить свою неудачу
        run: npm run check:native-shell

      - name: Тот же сторож — позитивный контроль
        run: npm run check:native-shell:plant

      # 0,1 с. ЗАХОД 7.200, долг 217. Сторож загрузки обязан считать срок
      # от начала ТЕКУЩЕЙ навигации, а не от запуска процесса. До
      # 16.09.2026 таймер заводился один раз в `onCreate` и снимался
      # только в `onDestroy` — и через 12 секунд от старта закрывал
      # свежим экраном ошибки страницу, только что открытую кнопкой
      # «Повторить». Ни лес, ни типы, ни один браузерный прогон этого не
      # видят: Java на машине сборки не исполняется вовсе (долг 176).
      - name: Срок сторожа загрузки идёт от начала навигации
        run: npm run check:load-watchdog

      - name: Тот же сторож — позитивный контроль
        run: npm run check:load-watchdog:plant

      # 0,1 с. Мост и маршруты оболочки ТОЛЬКО добавляются: снятый хост из
      # `allowNavigation`, снятый плагин или снятый пакет плагина не роняют
      # ни лес, ни типы, ни один браузерный прогон — это видно только с
      # телефона в руках, через несколько дней после мержа.
      - name: Мост и маршруты оболочки только добавляются
        run: npm run check:native-bridge

      - name: Тот же сторож — позитивный контроль
        run: npm run check:native-bridge:plant

      # 0,05 с. СЛОЙ ИСХОДНИКА долга 109: молчаливый адрес сервера обязан
      # быть боевым HTTPS, а `usesCleartextTraffic` — стоять только в
      # наборе `debug`. Главный слой — по СОБРАННОМУ релизному APK — живёт
      # в .github/workflows/android-debug.yml: здесь нет ни Android SDK,
      # ни пакета. Этот шаг ловит правку, которая вернёт всё назад, за
      # миллисекунды вместо шести минут сборки.
      - name: Релизная сборка не несёт локального адреса и cleartext (исходник)
        run: npm run check:native-release-safety

      - name: Тот же сторож — позитивный контроль
        run: npm run check:native-release-safety:plant

      # iOS-половина того же правила (долг 110). Здесь гоняется слой
      # ИСХОДНИКОВ — Info.plist, Info-Debug.plist, project.pbxproj и
      # capacitor.config.ts: собранного App.app в ubuntu-задании нет и
      # быть не может, для него нужен macOS с Xcode.
      #
      # СЛОЙ ПАКЕТА У НЕГО ТЕПЕРЬ ЕСТЬ (долг 113, заход 7.181), и здесь
      # он гоняется подсадками — ровно тем же приёмом, что у
      # check:release-signing: судья читает не пакет, а дословный вывод
      # `plutil -p App.app/Info.plist`, а образец этого вывода снят с
      # НАСТОЯЩЕГО пакета, собранного 11.09.2026 (`xcodebuild
      # -configuration Release -sdk iphoneos`, BUILD SUCCEEDED, App.app
      # 31 МБ). Поэтому правила «послабление транспорта доехало до
      # пакета», «в пакете чужой идентификатор» и «версия пакета
      # разошлась с Android» проверяются на каждом коммите, хотя ни
      # Xcode, ни macOS в этом задании нет. Прогон по СВЕЖЕ собранному
      # пакету стоит там, где для него есть Xcode, —
      # в .github/workflows/ios-release.yml.
      - name: Послабление транспорта iOS — только в отладочной конфигурации
        run: npm run check:ios-release-safety

      - name: Тот же сторож — позитивный контроль (исходники и пакет)
        run: npm run check:ios-release-safety:plant

      # 0,05 с. СЛОЙ ИСХОДНИКА долга 78. До 11.09.2026 слова
      # `signingConfig` не было во всём каталоге `android/` ни разу, а
      # `./gradlew assembleRelease` на это не жалуется: он молча кладёт
      # `app-release-unsigned.apk`, который Play Console не принимает
      # вовсе. Здесь же — вторая половина: файл ключа подписи не имеет
      # права оказаться ни в индексе git, ни на диске под `android/`,
      # потому что потерянный ключ Play не перевыпускается, а попавший в
      # историю git из неё не убирается.
      #
      # СЛОЙ ПАКЕТА У НЕГО ТЕПЕРЬ ЕСТЬ (долг 139, заход 7.179), и здесь
      # он гоняется подсадками: судья читает не файл, а дословный вывод
      # apksigner/jarsigner, а образцы этого вывода сняты с ЧЕТЫРЁХ
      # настоящих артефактов, собранных 11.09.2026 на машине владельца —
      # подписанных APK и AAB, отладочного APK и неподписанного APK.
      # Поэтому правила «не подписан», «подписан отладочным ключом» и
      # «подписан другим ключом» проверяются на каждом коммите, хотя ни
      # ключа, ни Android SDK в этом задании нет. Прогон по СВЕЖЕ
      # собранному артефакту стоит там, где для него есть SDK, —
      # в .github/workflows/android-debug.yml, вместе с отрицательным
      # контролем гейта (bundleRelease без ключа обязан упасть).
      - name: Релиз подписывается, а ключ в репозиторий не попадает
        run: npm run check:release-signing

      - name: Тот же сторож — позитивный контроль (исходники и пакет)
        run: npm run check:release-signing:plant

      # 0,05 с. ДОЛГИ 79, 179 и 184. Внутри нативной оболочки платных
      # кнопок нет ВОВСЕ: App Store 3.1.1 и Google Play Payments запрещают
      # уводить на внешнюю оплату цифрового содержимого, и это отклонение
      # на ревью, а не замечание.
      #
      # Здесь гоняется СТАТИЧЕСКАЯ половина — по исходникам, невосприимчива
      # к закомментированному коду; она спрашивает не «упоминает ли файл
      # ветку», а стоит ли ветка у КАЖДОГО входа на страницу цен (правило
      # по файлу пропускало вторую кнопку в том же файле — долг 184).
      #
      # ЖИВЫЕ половины стоят там, где уже поднят сервер, — внутри шага
      # «Rendered surface» (scripts/verify-rendered.mjs), и с 14.09.2026 их
      # ДВЕ, потому что одна отвечала не на весь вопрос.
      #
      # Первая берёт отдачу СЕРВЕРА по всем адресам, СОБРАННЫМ автоматически
      # (маршруты app router + карта сайта, обе локали — 132 адреса против
      # прежних одиннадцати рукописных), в ТРЁХ РОЛЯХ × двух обличьях
      # запроса. Вторая открывает те же адреса НАСТОЯЩИМ БРАУЗЕРОМ и жмёт
      # на органы управления: кнопку «Оформить подписку», которую владелец
      # нашёл в словаре, в ответе сервера не существует вовсе — её рисует
      # клиент после `/api/flashcards` и после одного нажатия на плитку
      # темы (замер: 0 платных органов на открытии, 1 после нажатия).
      #
      # Обе поднимают ради ролей отдельный сервер с E2E_TEST_SEED=1: без
      # него сессионная кука уходит с Secure и по http не возвращается, то
      # есть «войти» не вышло бы ни у кого.
      - name: Внутри приложения платных кнопок нет
        run: npm run check:native-payments

      - name: Тот же сторож — позитивный контроль
        run: npm run check:native-payments:plant

      # 0,3 с. ДОЛГ 194. «Отменена», под ней «Истекла 19 сентября 2026», а
      # сегодня 14 сентября — три утверждения владельца с живого телефона.
      # Причина была в порядке правил: слово `canceled` из колонки решало
      # раньше даты. Сторож гоняет пару формулировок по таблице состояний,
      # включая то, в котором лежит боевая строка, и запрещает «Истекла»
      # рядом с датой в будущем при любом содержимом колонки.
      - name: Текст про подписку выводится из даты, а не из слова
        run: npm run check:subscription-wording

      - name: Тот же сторож — позитивный контроль
        run: npm run check:subscription-wording:plant

      # 0,05 с. ДОЛГ 80. Цены файла локального тестирования StoreKit
      # сличаются с единственным источником цен сайта (amountMxnCents в
      # src/lib/plans.ts). До 12.09.2026 там лежали остатки долларовых
      # 7,99 / 47,99 / 49,99 — у Premium расхождение в 2,7 раза. Боевые
      # цены магазина заводит владелец руками в консолях, и туда этот
      # сторож не дотягивается.
      - name: Цены StoreKit сходятся с ценами сайта
        run: npm run check:price-parity

      - name: Тот же сторож — позитивный контроль
        run: npm run check:price-parity:plant

      # 0,2 с. Ни одно число вводной деки не написано руками. Базы не
      # трогает вовсе — слайды строятся на подставных значениях, поэтому
      # пустая база CI ему безразлична (проверено прогоном на пустом
      # файле базы).
      - name: Числа вводной деки посчитаны, а не написаны
        run: npm run check:intro-numbers

      - name: Тот же сторож — позитивный контроль
        run: npm run check:intro-numbers:plant

      # 0,1 с. Контраст WCAG у 18 пар токенов и «premium не стоит на
      # кликабельном». Позитивного контроля у этой проверки нет вовсе
      # (слепая зона, названа в docs/audit-2026-09-08-B.md), поэтому её
      # зелёный здесь читать как «не покраснела», а не как «доказано».
      - name: Токены дизайна — контраст и признак платного
        run: npm run check:tokens

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Долг 59 (PROGRESS.md 7.134, часть 4): всякий POST, уходящий из
      # умирающего документа, обязан иметь свой маршрут в service worker.
      # Нарушение этого правила съедало у Chromium 6 и 8 доставок из 16.
      - name: POST из умирающего документа имеет маршрут в SW
        run: npm run check:dying-posts

      # Обязательная вторая половина: сторож, который не краснеет от
      # подсадки, зелёный ни о чём не говорит (PROGRESS.md 4.1).
      - name: Тот же сторож — позитивный контроль
        run: npm run check:dying-posts:plant

      # Сам `check:story-topics` здесь стоять НЕ может: база CI держит
      # ноль строк `Story`, и проверка о чипах каталога на пустом
      # каталоге вакуумна (она это и говорит вслух, красным). Поэтому в
      # CI стоит только её позитивный контроль: он идёт по ЗАВЕДОМО
      # здоровой выборке в памяти и базы не спрашивает вовсе, то есть
      # правило «чип темы, отдающий 0 карточек, — падение» здесь
      # проверяется целиком. Сама проверка — в `npm run verify` и в
      # списке исключений PROGRESS.md.
      - name: Чип темы с нулём карточек — падение (позитивный контроль)
        run: npm run check:story-topics:plant

      # Заход 7.150: у рассказа появилось испанское название. Здесь стоит
      # только позитивный контроль — база этой задачи пуста, а «нарушений
      # 0» на нуле строк правило 4.1 результатом не считает (проверка
      # честно краснеет строкой «в базе нет ни одного рассказа»). Контроль
      # идёт по заведомо здоровой выборке в памяти и базы не спрашивает:
      # семь подсадок, из них две — в САМО правило подачи (заморозка и
      # пропавший оригинал), потому что «замороженная страница получила
      # новую подачу» строкой данных не изображается. Сама проверка стоит
      # в задаче Playwright — там база держит фикстуру рассказов.
      - name: Испанское название рассказа — позитивный контроль сторожа
        run: npm run check:story-title-es:plant

      # The positive control for the Stripe env-shape guard. CI has no Stripe
      # variables at all, so the guard's real run here is vacuously green —
      # which is exactly the kind of green PROGRESS.md 4.1 says proves
      # nothing. This step plants eight malformed values and fails unless the
      # guard goes red on every one.
      - name: Stripe env guard — positive control
        run: npm run check:stripe-env:self-test

      # The same control for the AUTHENTICITY check (PROGRESS.md 7.66): the
      # shape guard above would have passed the real 2026-08-24 defect, which
      # was a properly formed Price id pointing at an ARCHIVED price. This
      # step plants an archived price, a nonexistent one, a wrong amount and a
      # wrong currency, and fails unless each is caught. No Stripe key is
      # needed: the single Stripe call is injected.
      - name: Stripe price authenticity — positive control
        run: npm run check:stripe-prices:self-test

      - name: Build
        run: npm run build

      # Вторая половина сторожа 7.168: комментарий до бандла не доживает,
      # поэтому здесь ищется голый текст — и находится даже обращение
      # через строковый ключ, и вызов, принесённый чужой зависимостью.
      - name: Браузерного синтеза нет и в собранных клиентских бандлах
        run: npm run check:no-runtime-tts:bundles

      # Заход 7.219, долг 280. Читает СОБРАННЫЕ артефакты, поэтому стоит
      # после сборки: в том, что уходит в браузер, не должно быть ни одного
      # адреса разработки, клиентский Sentry обязан судить хост страницы, а
      # локальные `.env` — не задавать VERCEL_ENV.
      - name: Адреса разработки нет ни в сборке, ни в воротах Sentry
        run: npm run check:no-dev-origin

      - name: Адрес разработки — позитивный контроль сторожа
        run: npm run check:no-dev-origin:plant

      - name: Unit tests
        run: npm run test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push database schema
        run: npx prisma db push

      # This job used to have no seed step, and said so at length: there was
      # no committed source of FlashcardCard content, re-running
      # generate:word-games against an empty bank writes zero puzzles, and
      # so e2e/word-games.spec.ts and e2e/glossary.spec.ts both self-skipped
      # under CI. The cost of that was 16 of the suite's tests — a third of
      # it — not running here while the job reported green.
      #
      # The fixture below is the answer, and it deliberately does NOT try to
      # rebuild the card bank: it loads four real WordGamePuzzle rows and
      # four real GlossaryTerm rows straight from e2e/fixtures/*.json. It
      # refuses to write to any database that already holds content it did
      # not put there, so it can only ever touch an empty CI one. See
      # PROGRESS.md 7.52 and the script's own header.
      #
      # Still true, and still worth knowing: lessons and exams pass here via
      # each feature's bundled content.json fallback, not via real seed
      # data. Everything else DB-backed is either seeded above or absent.
      - name: Seed the e2e content fixture
        run: npx tsx scripts/seed-e2e-fixture.mjs

      # Тот же сторож, но по НАСТОЯЩИМ строкам: фикстура выше держит три
      # рассказа — с испанским названием, без него и замороженный. Три
      # состояния подачи, то есть проверка здесь не вакуумна.
      - name: Испанское название рассказа — по строкам фикстуры
        run: npm run check:story-title-es

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Run Playwright tests
        run: npm run test:e2e

      # The gate that makes 30.08.2026 unrepeatable. A green Playwright exit
      # code says nothing about how many tests produced it: CI ran 25 of 49
      # and passed (PROGRESS.md 7.52). This reads the run's own report and
      # fails if anything skipped or if fewer tests executed than the suite
      # is known to have. `if: always()` because a run that fails AND quietly
      # shrank is the case where knowing matters most.
      - name: Check the e2e suite actually ran in full
        if: always()
        run: npm run check:e2e-coverage:run

      # Debt 19. lint, typecheck and 465 unit tests were green for the ten
      # days every lesson page on production rendered nothing but "Something
      # went wrong" (incident №1). None of them opens a browser. This step
      # does, and it is here rather than in a job of its own because this job
      # has already installed Chromium and already built the app — a separate
      # job would repeat npm ci, prisma generate, db push, the build and the
      # browser install to run a two-minute check.
      #
      # Only for main: on a pull request that targets main, and on a push to
      # main. Intermediate commits on a branch do not pay for it.
      #
      # The fixture is not optional. CI's database is empty (see the note
      # above), and with no glossary rows GlossaryText builds no pattern, so
      # incident №1 would not reproduce here even with the bug fully
      # present. The fixture puts back the one thing that made it fatal: a
      # term containing a hyphen.
      - name: Seed the render fixture
        if: github.event.pull_request.base.ref == 'main' || github.ref == 'refs/heads/main'
        timeout-minutes: 5
        run: npx tsx scripts/seed-ci-render-fixture.mjs

      # timeout-minutes is the fuse, not the fix. On 29.08.2026 this step
      # finished its work in a second and then hung for 56 minutes because
      # verify-rendered.mjs killed `npx` instead of the server npx had
      # started, and the surviving grandchild's inherited pipes kept the
      # process alive (see that file's header). That is fixed; this cap is
      # here so the NEXT way it could hang costs minutes instead of an hour.
      # The check itself takes about a minute, so 10 is generous.
      # Заход 7.185, долг 161. В этом же шаге, на этом же сервере, гоняется
      # `scripts/check-bottom-inset.mjs` и его подсадка (см.
      # scripts/verify-rendered.mjs, седьмой и восьмой spawn): «ни один
      # прижатый к низу окна слой не накрывает орган, до которого человек
      # обязан добраться». Отдельным шагом он не стоит по той же причине,
      # по какой здесь стоят check:layout, check:internal-links и живая
      # половина check:404 — сервер уже поднят, браузер уже установлен,
      # сборка уже своя; отдельное задание заплатило бы за npm ci, prisma
      # generate, сборку и установку движка ещё раз.
      #
      # ПРЕДОХРАНИТЕЛЬ ПОДНЯТ С 10 ДО 30 МИНУТ 14.09.2026, И ВОТ ЧЕМ ЭТО
      # ОПЛАЧЕНО. Заход 7.194 добавил в этот же шаг браузерный обход
      # платных поверхностей: 132 собранных адреса × 3 роли = 396 экранов
      # и около 2200 нажатий. Первый прогон в CI дошёл до 270 экранов из
      # 396 за 6 мин 50 с и был срезан предохранителем — то есть работа
      # шла, и всё, что она успела измерить, было зелёным (живая половина
      # 0 находок, подсадка поймана во всех трёх ролях: 428/420/420).
      # Красный дал не дефект, а потолок.
      #
      # 7.196, ЧАСТЬ 5: ТЯЖЁЛАЯ ПОЛОВИНА УЕХАЛА В СВОЁ ЗАДАНИЕ.
      #
      # Оценка «около 16 минут» из 7.194 не подтвердилась. PR #316 дошёл
      # до 390 экранов из 396 и был срезан предохранителем на 30-й минуте,
      # а полный прогон этого шага занял 44 минуты. Красный при этом давал
      # не дефект, а таймер — и отличить одно от другого без ручного
      # перезапуска было нельзя. Шаг, который роняет случайные PR, стоит
      # дороже минут, которые он экономит.
      #
      # Поэтому перепись платных поверхностей (132 адреса × 3 роли, ~2200
      # нажатий — ~38 минут из 44) здесь больше не гоняется: её берёт
      # задание `purchase-surfaces` ниже, тремя долями на трёх бегунках
      # одновременно. Работа не уменьшена ни на один экран.
      #
      # Здесь остаётся всё остальное — отрисованная поверхность, вёрстка,
      # внутренние ссылки, живая половина 404, прижатые к низу слои и
      # живая половина `check:native-payments`.
      #
      # Предохранитель оставлен на 30 минутах при ожидаемой цене остатка
      # около 6 минут: он и должен быть запасом, а не потолком. Урок
      # 29.08.2026 (56 минут висящего шага) он закрывает так же.
      - name: Rendered surface + прижатые к низу слои (real browser, after hydration)
        if: github.event.pull_request.base.ref == 'main' || github.ref == 'refs/heads/main'
        timeout-minutes: 30
        run: npm run check:rendered:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ====================================================================
  # ПЕРЕПИСЬ ПЛАТНЫХ ПОВЕРХНОСТЕЙ — ТРЕМЯ ДОЛЯМИ ПАРАЛЛЕЛЬНО (7.196, ч. 5)
  # ====================================================================
  #
  # ЗАЧЕМ ОТДЕЛЬНОЕ ЗАДАНИЕ. До 14.09.2026 эта перепись жила внутри шага
  # «Rendered surface» задания `e2e`, и после роста прибора в 7.194 она
  # перестала помещаться: PR #316 срезан предохранителем на 390 экранах из
  # 396, полный прогон — 44 минуты. Красный означал таймер, а не находку.
  #
  # Работа не уменьшена ни на один экран: те же 132 адреса × 3 роли и те
  # же ~2200 нажатий, только разделённые по остатку от деления на три и
  # идущие на трёх бегунках сразу. Стенные часы делятся примерно втрое;
  # минут CI тратится примерно столько же плюс тройная подготовка.
  # Решение владельца: время захода дороже минут CI.
  #
  # ПОЧЕМУ ДОЛИ ПО ОСТАТКУ, А НЕ ОТРЕЗКАМИ — см. `parseShard` в
  # scripts/check-rendered-purchase-surfaces.mjs: адреса в переписи идут
  # группами (все уроки подряд, все рассказы подряд), и отрезок отдал бы
  # одной доле только дешёвые экраны, а другой — только дорогие.
  #
  # ПОЧЕМУ `fail-fast: false`: доля, упавшая по находке, не должна гасить
  # две другие — иначе в отчёте будет треть правды вместо целой.
  purchase-surfaces:
    name: Платные поверхности (доля ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: test
    if: github.event.pull_request.base.ref == 'main' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push database schema
        run: npx prisma db push

      # Те же две фикстуры, что у задания e2e: без них перепись адресов
      # соберёт меньше страниц с содержимым, и «0 платных органов» было бы
      # доказано отсутствием страниц.
      - name: Seed the e2e content fixture
        run: npx tsx scripts/seed-e2e-fixture.mjs

      - name: Seed the render fixture
        timeout-minutes: 5
        run: npx tsx scripts/seed-ci-render-fixture.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Предохранитель. Замер на настоящем прогоне: живая половина доли —
      # 101 с, всё задание целиком — 4 мин 41 с (с `npm ci`, Prisma,
      # фикстурами, установкой браузера и сборкой). 20 минут — всё ещё
      # вчетверо больше, чем нужно, и при этом ВТРОЕ дешевле прежних 45 в
      # том случае, ради которого предохранитель и существует: шаг,
      # который ВИСИТ. Именно это здесь и случилось — первая редакция
      # гоняла в этом задании ещё и подсадку, и она повисла дважды из
      # трёх, съев по 45 минут. Подсадка возвращена в соседнее задание,
      # где стоит секунды; см. заголовок scripts/verify-purchase-surfaces.mjs.
      - name: Перепись платных поверхностей — доля ${{ matrix.shard }} из 3
        timeout-minutes: 20
        run: npm run check:purchase-surfaces:shard -- --shard=${{ matrix.shard }}/3
