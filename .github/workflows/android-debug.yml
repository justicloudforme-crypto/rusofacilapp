# Нативная сборка Android — ОТДЕЛЬНЫЙ workflow, а не задание в ci.yml.
#
# ПОЧЕМУ ОН СУЩЕСТВУЕТ. К 09.09.2026 каталог `android/` переехал под
# `com.rusofacilapp.app` (7.154), витринное имя сведено к «RusoFácil»
# (7.155), микрофон объявлен двумя разрешениями (7.154) — и НИ ОДНА из
# этих правок ни разу не была собрана. Всё, что о них известно, доказано
# СТАТИЧЕСКИ: `check:app-id` сличает одиннадцать объявлений друг с другом,
# `check:brand` — пять литералов, `check:native-permissions` — манифесты.
# Ни один из них по построению не может сказать, что из этого попало в
# пакет и собирается ли пакет вообще. Это и был главный незакрытый риск
# переезда.
#
# ЧТО ЗДЕСЬ ЕСТЬ И ЧЕГО НЕТ. Собирается **debug** и только он: ключ
# подписи в репозитории не заводится и релизная подпись не делается —
# это часть владельца. Артефакт `app-debug.apk` подписан отладочным
# ключом, который Gradle генерирует сам, и в магазин не годится в
# принципе.
#
# ПОЧЕМУ НЕ В `ci.yml`. Задание тянет JDK, Android SDK и дистрибутив
# Gradle и стоит минуты; `ci.yml` гоняется на каждый коммит любой ветки.
# Поэтому фильтр по путям ниже: сборка запускается только когда тронуто
# то, что на неё влияет. `workflow_dispatch` — чтобы её можно было
# позвать руками, ничего не трогая.
name: Android debug build

on:
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "capacitor-shell/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-apk-facts.mjs"
      - "scripts/check-native-release-safety.mjs"
      - "scripts/check-foreground-service-types.mjs"
      - "scripts/check-native-permissions.mjs"
      - "scripts/check-release-signing.mjs"
      - ".github/workflows/android-debug.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "capacitor-shell/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-apk-facts.mjs"
      - "scripts/check-native-release-safety.mjs"
      - "scripts/check-foreground-service-types.mjs"
      - "scripts/check-native-permissions.mjs"
      - "scripts/check-release-signing.mjs"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Значения читает `postinstall` (prisma generate) и ничего больше:
  # нативной сборке база не нужна вовсе, но `npm ci` обязан пройти.
  DATABASE_URL: "file:./dev.db"
  # Версии SDK держатся ОДНОЙ строкой каждая и совпадают с
  # android/variables.gradle (compileSdkVersion = 36). Разойдутся —
  # сборка скажет об этом сама, отсутствующей платформой.
  ANDROID_PLATFORM: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  debug-apk:
    name: assembleDebug + числа из самого APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # JDK 21: AGP 8.13 (android/build.gradle) требует 17+, Capacitor 8
      # собран под 21. `cache: gradle` кэширует ~/.gradle между прогонами —
      # именно он превращает вторую сборку из минут в десятки секунд.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      # Раннер приносит Android SDK с собой, но НЕ обязан приносить
      # именно ту платформу, под которую собран проект. Ставим её явно и
      # печатаем, что стоит, — иначе «сборка упала» и «на раннере не
      # оказалось android-36» выглядят одинаково.
      - name: Android SDK — платформа и build-tools под compileSdk
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      # `cap sync` копирует webDir (capacitor-shell — две страницы, не
      # весь public/) в android/app/src/main/assets/public и переписывает
      # список плагинов. Сборки Next.js здесь НЕ нужно: приложение —
      # тонкая оболочка над удалённым URL (см. capacitor.config.ts).
      - name: npx cap sync android
        run: npx cap sync android

      - name: assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Числа берутся ИЗ ПАКЕТА, а не из исходников: в этом весь смысл
      # задания. `aapt2 dump badging` читает скомпилированный
      # AndroidManifest внутри APK.
      - name: Числа из самого APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" dump badging "$APK" > apk-badging.txt
          cat apk-badging.txt
          node scripts/check-apk-facts.mjs --badging=apk-badging.txt

      # СЛОЙ ПАКЕТА у второго сторожа (долг 107). Без `--badging` он читает
      # НАШ манифест, а Play Console спрашивает про каждое разрешение в
      # ЗАГРУЖЕННОМ пакете: ровно так три наших разрешения выглядели
      # исчерпывающим списком, пока первая настоящая сборка не показала
      # двенадцать. Здесь тот же сторож судит по тому же множеству, что и
      # анкета.
      - name: Разрешения В ПАКЕТЕ — ровно под то, что зовёт код
        run: node scripts/check-native-permissions.mjs --badging=apk-badging.txt

      - name: Тот же сторож — позитивный контроль
        run: npm run check:apk-facts:plant

      # РЕЛИЗНЫЙ вариант — и только ради него. Долг 109: до 09.09.2026
      # `app-release-unsigned.apk` нёс внутри `assets/capacitor.config.json`
      # строку `"url": "http://192.168.1.69:3000"` и `usesCleartextTraffic=true`
      # в скомпилированном манифесте. Судить об этом по исходнику нельзя:
      # `server.url` попадает в пакет через `cap sync` (файл в .gitignore),
      # а `usesCleartextTraffic` — через слияние манифестов всех наборов.
      # Подпись здесь по-прежнему НЕ делается: `assembleRelease` без
      # signingConfig отдаёт неподписанный пакет, и для чтения манифеста и
      # ассетов подпись не нужна.
      - name: assembleRelease (неподписанный) — ради проверки ниже
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: В релизном пакете нет ни локального адреса, ни cleartext
        run: |
          set -euo pipefail
          RAPK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -l "$RAPK"
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" dump xmltree --file AndroidManifest.xml "$RAPK" > release-manifest.txt
          unzip -p "$RAPK" assets/capacitor.config.json > release-capacitor-config.json
          cat release-capacitor-config.json
          node scripts/check-native-release-safety.mjs --xmltree=release-manifest.txt --config=release-capacitor-config.json

      - name: Тот же сторож — позитивный контроль
        run: npm run check:native-release-safety:plant

      # Долг 111. Связку «тип службы переднего плана ⇄ парное разрешение»
      # нельзя проверить по исходникам: тип объявлен в манифесте
      # `@capgo/capacitor-media-session` внутри node_modules, разрешение —
      # в нашем манифесте, и в одном множестве они оказываются только
      # после слияния манифестов, то есть в пакете. Дамп берётся debug'а:
      # набор служб и разрешений у обоих вариантов один и тот же (проверено
      # 09.09.2026: 12 из 12 совпали), а release здесь уже разобран выше.
      - name: Тип службы и парное разрешение — из самого пакета
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > debug-manifest.txt
          node scripts/check-foreground-service-types.mjs --xmltree=debug-manifest.txt

      - name: Тот же сторож — позитивный контроль
        run: npm run check:fgs-types:plant


      # ─────────────────────────────────────────────────────────────
      # СЛОЙ ПАКЕТА У ПОДПИСИ (долг 139, заход 7.179).
      #
      # ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ. Ключа подписи в CI нет: хранилище
      # боевого аккаунта Play невосстановимо, и класть его в секреты
      # репозитория ради зелёной галочки — плохой размен. Поэтому путь
      # без ключа объявлен ЯВНО, а не оставлен умолчанием, и он не
      # пустой: одну половину долга 139 можно доказать именно БЕЗ
      # ключа — и она доказывается ниже.
      #
      # ОТРИЦАТЕЛЬНЫЙ КОНТРОЛЬ ГЕЙТА. `bundleRelease` без ключа обязан
      # УПАСТЬ нашим сообщением, а не собрать пакет. Утверждение это —
      # о поведении Gradle, и цена доверия чтению текста уже известна:
      # 12.09.2026 тот же хук дважды уронил обычный `assembleRelease`
      # (прогоны 34662544578 и 34662918234), и поймал это не сторож по
      # исходникам, а собранный артефакт. Здесь проверяются оба конца
      # сразу: `bundleRelease` падает, `assembleRelease` — нет (он
      # собирается шагом выше и на нём стоят два сторожа).
      - name: bundleRelease БЕЗ ключа обязан упасть нашим сообщением
        working-directory: android
        run: |
          set -uo pipefail
          set +e
          ./gradlew bundleRelease --no-daemon > bundle-no-key.log 2>&1
          CODE=$?
          set -e
          cat bundle-no-key.log
          if [ "$CODE" -eq 0 ]; then
            echo "ОТКАЗ: bundleRelease без ключа СОБРАЛСЯ — гейт не работает, и в Play уехал бы неподписанный AAB"
            exit 1
          fi
          if ! grep -q "bundleRelease без ключа подписи собрал бы AAB" bundle-no-key.log; then
            echo "ОТКАЗ: bundleRelease упал, но НЕ нашим сообщением — упал он по другой причине, и гейт тут ни при чём"
            exit 1
          fi
          echo "bundleRelease без ключа: код выхода $CODE, сообщение наше — гейт держит"

      # ВТОРАЯ ПОЛОВИНА — только если ключ дан секретами. Её нет в
      # обычных прогонах, и это не забывчивость: без ключа доказывать
      # нечем. Шаг написан заранее, чтобы владельцу оставалось положить
      # два секрета, а не сочинять шаг.
      - name: Подпись артефакта — есть ли чем проверять
        id: signing-key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "Ключа подписи в секретах репозитория НЕТ (ANDROID_KEYSTORE_BASE64 пуст)."
            echo "Слой пакета у подписи в этом прогоне НЕ гоняется — доказывать нечем."
            echo "Что при этом ВСЁ РАВНО доказано выше: bundleRelease без ключа падает нашим сообщением."
            echo "Настоящие подписанные APK и AAB собраны 12.09.2026 на машине владельца, их вывод"
            echo "apksigner/jarsigner лежит образцами внутри scripts/check-release-signing.mjs и гоняется"
            echo "подсадками в npm run check:release-signing:plant — в ci.yml, на каждом коммите."
          fi

      - name: bundleRelease С ключом + apksigner verify + слой пакета
        if: steps.signing-key.outputs.present == 'yes'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          # Хранилище пишется во временный каталог ВНЕ дерева репозитория:
          # `check:release-signing` обходит android/ и ios/ диском, и файл
          # ключа внутри уронил бы его — правильно уронил бы.
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          export ANDROID_KEYSTORE_FILE="$KS"
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -l "$APK" "$AAB"
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$APK" > ../apk-certs.txt
          jarsigner -verify -verbose:summary -certs "$AAB" > ../aab-certs.txt
          cat ../apk-certs.txt
          grep -E "jar verified|jar is unsigned|Signed by" ../aab-certs.txt || true
        # Судит не этот шаг, а сторож: он же гоняется по образцам в ci.yml.
      - name: Слой пакета — судит сторож, а не глаз
        if: steps.signing-key.outputs.present == 'yes'
        env:
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          EXPECT=""
          if [ -n "${ANDROID_CERT_SHA256:-}" ]; then EXPECT="--expect-sha256=$ANDROID_CERT_SHA256"; fi
          node scripts/check-release-signing.mjs --certs=apk-certs.txt --certs=aab-certs.txt $EXPECT

      - name: Выложить APK артефактом
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
          retention-days: 14
          if-no-files-found: warn
