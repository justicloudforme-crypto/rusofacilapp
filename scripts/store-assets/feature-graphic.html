<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>RusoFácil — feature graphic 1024×500</title>
    <style>
      /*
        Баннер витрины Google Play. Ровно 1024×500, без прозрачности.

        Цвета — НЕ выдуманы: взяты из `src/app/tokens.generated.css`,
        то есть из тех же токенов, которыми выкрашен живой сайт.
          --color-primary-600  #253B7E  фон (главный акцент сайта)
          --color-primary-800  #1A344D  вторая точка градиента
          --color-neutral-50   #FFF8EC  кремовый, цвет фона сайта → текст
          --color-neutral-300  #D1BE9F  приглушённый кремовый → подзаголовок
          --color-premium-500  #CE9627  золото → тонкая черта-акцент

        Запреты Play и задания соблюдены осознанно:
          • эмодзи — ни одного;
          • слов целиком заглавными нет (в том числе в `text-transform`);
          • нет «gratis», «mejor», «#1», нет призыва скачать;
          • мелкого текста у краёв нет: наименьший кегль 26px, ближайший к
            краю элемент отстоит на 84px — Play обрезает кромку;
          • ничего детского: ни игрушечных шрифтов, ни слов про детей,
            аудитория 18+.
      */
      @font-face {
        font-family: "RF Sans";
        src: local("Helvetica Neue"), local("Arial");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1024px; height: 500px; overflow: hidden; }
      body {
        /* Непрозрачный фон обязателен: у баннера не может быть альфы. */
        background: #253b7e;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .banner {
        position: relative;
        width: 1024px;
        height: 500px;
        background: linear-gradient(115deg, #1a344d 0%, #253b7e 58%, #2d4a90 100%);
        display: flex;
        align-items: center;
        gap: 52px;
        padding: 0 84px; /* безопасное поле: Play обрезает кромку */
        overflow: hidden;
      }
      /* Матрёшка — фирменный знак проекта, тот же файл, из которого
         собрана иконка 512 для Play (resources/icon.png). */
      .mark {
        flex: 0 0 auto;
        width: 208px;
        height: 208px;
        border-radius: 40px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: 0 18px 44px rgba(9, 20, 38, 0.38);
      }
      .mark img { width: 208px; height: 208px; display: block; }
      .copy { min-width: 0; }
      .name {
        font-size: 86px;
        line-height: 1;
        letter-spacing: -0.02em;
        font-weight: 700;
        color: #fff8ec;
      }
      .rule {
        width: 148px;
        height: 7px;
        border-radius: 4px;
        background: #ce9627;
        margin: 30px 0 26px;
      }
      .claim {
        font-size: 44px;
        line-height: 1.18;
        font-weight: 500;
        color: #fff8ec;
      }
      .sub {
        margin-top: 20px;
        font-size: 28px;
        line-height: 1.3;
        font-weight: 400;
        color: #d1be9f;
      }
      /* Декоративная дуга — только цвет фона, без текста и без края. */
      .glow {
        position: absolute;
        right: -150px;
        bottom: -230px;
        width: 540px;
        height: 540px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, rgba(206, 150, 39, 0.17), rgba(206, 150, 39, 0) 68%);
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="glow"></div>
      <div class="mark"><img src="../../resources/icon.png" alt="" /></div>
      <div class="copy">
        <div class="name">RusoFácil</div>
        <div class="rule"></div>
        <div class="claim">Ruso explicado en español</div>
        <div class="sub">Cursos de A1 a B2, lecturas y vocabulario</div>
      </div>
    </div>
  </body>
</html>
