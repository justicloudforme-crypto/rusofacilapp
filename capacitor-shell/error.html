<!doctype html>
<!--
  Capacitor's `server.errorPath` target (see capacitor.config.ts). Loaded
  by the native WebView itself — not by Next.js, not proxied through the
  remote server — whenever it can't reach `server.url` at all (device has
  no connection, DNS failure, server down). This is the one screen in the
  whole app that has to work with zero network and zero JS bundle: no
  Capacitor plugin access on Android (per Capacitor's own docs for this
  file), no dictionary/i18n system, nothing from the Next.js app. Colors
  match the site's light-theme brand tokens (src/app/globals.css) by
  hardcoded hex since there's no CSS variable pipeline here.

  ДВЕ ПРИЧИНЫ, ПО КОТОРЫМ ЭТОТ ЭКРАН ПОЯВЛЯЕТСЯ (7.189, долг 175).
  Первая — отказ загрузки: её ловит сам Capacitor через `server.errorPath`
  (`BridgeWebViewClient.onReceivedError`). Вторая появилась 13.09.2026 и
  Capacitor её НЕ ловит вовсе: сервер не отказал, а МОЛЧИТ — запрос висит,
  и webview остаётся белым сколько угодно долго. Её ловит сторож загрузки
  в `android/app/src/main/java/com/rusofacilapp/app/MainActivity.java`: он
  сам грузит этот файл, если страница не нарисовалась за отведённое время.
  Поэтому текст ниже говорит про обе причины сразу («не ответил или нет
  соединения»), а не только про отсутствие сети: показать «Sin conexión»
  человеку, у которого сеть есть, а молчит наш сервер, — неправда.

  ПОЧЕМУ КНОПКА НЕ `location.reload()`. Этот файл загружен НЕ с боевого
  адреса: Capacitor отдаёт его по своему локальному адресу
  (`https://localhost/error.html`, см. `Bridge.getErrorUrl()`), и
  `reload()` перезагружал бы сам экран ошибки — то есть кнопка «Повторить»
  не пыталась повторить ничего. Поэтому адрес написан явно. Он обязан
  совпадать с `PRODUCTION_URL` из `capacitor.config.ts`, и это сличает
  `npm run check:native-shell`. Следствие, названное честно: в режиме
  живого перезапуска (CAPACITOR_LIVE_RELOAD=1) кнопка уведёт на прод, а не
  на ноутбук разработчика — для отладочной сборки это безвредно.

  ВИДИМЫХ СТРОК РОВНО ТРИ, и все три существуют в двух локалях. Ни одной
  английской строки на экране быть не может: набор видимого текста
  сличается с ожидаемым в браузере (`scripts/check-native-shell-render.mjs`),
  поэтому четвёртая строка, добавленная сюда мимо словаря, уронит сборку.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RusoFácilapp</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #fff8ec;
        color: #1c1a16;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
        padding-top: max(32px, env(safe-area-inset-top));
        padding-bottom: max(32px, env(safe-area-inset-bottom));
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 90px;
        position: relative;
      }
      .mark .head {
        position: absolute;
        left: 50%;
        top: 0;
        width: 46%;
        aspect-ratio: 1;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #fbe3c0;
      }
      .mark .body {
        position: absolute;
        inset-inline: 0;
        bottom: 0;
        height: 80%;
        border-radius: 46% 46% 38% 38% / 58% 58% 30% 30%;
        background: #2d5f8a;
      }
      h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
      p { max-width: 30ch; margin: 0; color: #6b6255; line-height: 1.5; font-size: 0.95rem; }
      button {
        margin-top: 8px;
        border: none;
        border-radius: 999px;
        background: #1c1a16;
        color: #fff8ec;
        font-size: 0.95rem;
        font-weight: 500;
        padding: 12px 28px;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
      button[disabled] { opacity: 0.6; }
      /* Указатель занятости у кнопки «Повторить» (долг 181). До
         13.09.2026 нажатие не показывало НИЧЕГО: экран уходил в пустой
         светлый прямоугольник примерно на две секунды, а потом
         возвращался этот же экран ошибки. Человек в этот момент считает,
         что приложение сломалось, — и он прав в том, что видит.
         `aria-hidden` на самом кружке: он украшение, а состояние кнопки
         озвучивает её собственная подпись. */
      .spin {
        display: none;
        width: 14px;
        height: 14px;
        margin-right: 8px;
        vertical-align: -2px;
        border: 2px solid rgba(255, 248, 236, 0.35);
        border-top-color: #fff8ec;
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }
      button[data-busy="1"] .spin { display: inline-block; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .spin { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">
      <div class="head"></div>
      <div class="body"></div>
    </div>
    <h1 data-i18n="title">No pudimos abrir la aplicación</h1>
    <p data-i18n="body">El servidor no respondió o tu teléfono no tiene conexión a internet. Revisa tu conexión y vuelve a intentarlo.</p>
    <button type="button" id="retry">
      <span class="spin" aria-hidden="true"></span><span id="retry-label" data-i18n="retry">Reintentar</span>
    </button>

    <script>
      // Боевой адрес. Обязан совпадать с PRODUCTION_URL из
      // capacitor.config.ts — сличает npm run check:native-shell.
      var SITE_URL = "https://rusofacilapp.com";
      // Сколько ждать ответа, прежде чем признать попытку неудачной.
      // Восемь секунд — из того же замера, что и сторож загрузки в
      // MainActivity.java: боевой прод отвечает за доли секунды, а
      // мобильная сеть в метро отдаёт первую страницу и за восемь.
      var PROBE_TIMEOUT_MS = 8000;
      // Сколько кнопка обязана ПРОБЫТЬ занятой, даже если отказ пришёл
      // мгновенно. Без этого порога отказ по сразу известной причине (имя
      // не разрешилось, сети нет вовсе) возвращает кнопку в исходное
      // состояние за десятки миллисекунд, и нажатие снова выглядит как
      // «ничего не произошло» — та же жалоба, из-за которой всё и чинится.
      var MIN_BUSY_MS = 600;

      /**
       * ОДИН СЛЕПОЙ ПЕРЕХОД ПОСЛЕ НЕУДАЧНОЙ ПРОБЫ — ПРАВКА 7.228.
       *
       * ЧТО БЫЛО ДОКАЗАНО ТЕКСТОМ. Проба ниже — это `fetch` с ЭТОГО
       * документа, а он загружен с `https://localhost/error.html`
       * (`Bridge.getErrorUrl()`). Для источника `https://localhost`
       * воркера сайта не существует вовсе, поэтому проба идёт прямо в
       * сеть и без сети падает ВСЕГДА — сколько бы сохранённых страниц
       * ни лежало на телефоне. До 7.228 отказ пробы заканчивал дело
       * надписью «Todavía no se pudo», и перехода на сайт не случалось
       * НИ РАЗУ: ровно это владелец и видел 23.09.2026.
       *
       * Переход же идёт на источник САЙТА, и там его встречает каркас
       * без сети (`OfflineShellWebViewClient`). То есть отказ пробы не
       * доказывает, что переход бесполезен, — и один переход мы делаем.
       *
       * ПОЧЕМУ РОВНО ОДИН. Второй нужен только затем, чтобы вернуть
       * прежний укор «пустой кадр вместо ответа» (долг 181): если
       * слепой переход уже был и мы снова здесь, значит и он не помог,
       * и человеку честнее сказать словами. Отметка живёт в
       * `window.name`, потому что переход рвёт этот документ, а имя
       * вкладки его переживает; хранилище браузера на этом экране
       * трогать нечем — файл локальный и вне `safe-storage`.
       */
      var BLIND_MARK = "rf-error-blind-try";
      function blindTryUsed() {
        return window.name === BLIND_MARK;
      }
      function markBlindTry() {
        window.name = BLIND_MARK;
      }

      var button = document.getElementById("retry");
      var label = document.getElementById("retry-label");
      var body = document.querySelector('[data-i18n="body"]');
      var idleLabel = "";

      /**
       * СЛОВАРЬ ЭКРАНА ОШИБКИ — ОДИН НА ОБЕ ЛОКАЛИ (заход 7.198, часть 3).
       *
       * До 15.09.2026 испанский жил в разметке выше, а русский — здесь, и
       * согласовывать их было нечем. Теперь обе локали стоят рядом в одном
       * объекте, а текст в разметке — это ЗАПАСНОЙ путь на случай, когда
       * JS не исполнился вовсе (файл открывается локально, без сети и без
       * бандла, и остаться пустым он права не имеет). Что они совпадают
       * знак в знак, сличает `npm run check:shell-error-locale`.
       */
      var strings = {
        es: {
          title: "No pudimos abrir la aplicación",
          body: "El servidor no respondió o tu teléfono no tiene conexión a internet. Revisa tu conexión y vuelve a intentarlo.",
          retry: "Reintentar",
          retrying: "Conectando…",
          failed: "Todavía no se pudo. Revisa tu conexión e inténtalo otra vez.",
        },
        ru: {
          title: "Не удалось открыть приложение",
          body: "Сервер не ответил или на телефоне нет соединения с интернетом. Проверьте соединение и попробуйте снова.",
          retry: "Повторить",
          retrying: "Пробуем…",
          failed: "Пока не получается. Проверьте соединение и попробуйте ещё раз.",
        },
      };
      // Запасной язык экрана — испанский, как и вся разметка выше.
      var FALLBACK_LOCALE = "es";
      var current = FALLBACK_LOCALE;

      var say = function (key) {
        return (strings[current] && strings[current][key]) || strings[FALLBACK_LOCALE][key];
      };

      function applyLocale(lang) {
        if (!strings[lang]) return;
        current = lang;
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (strings[lang][key]) el.textContent = strings[lang][key];
        });
        idleLabel = say("retry");
        if (button && button.getAttribute("data-busy") !== "1") label.textContent = idleLabel;
      }

      /**
       * ЯЗЫК ЭТОГО ЭКРАНА НАЗЫВАЕТ ОБОЛОЧКА, А НЕ ТЕЛЕФОН.
       *
       * Раньше он брался из `navigator.language`, то есть из языка
       * ТЕЛЕФОНА. У владельца телефон испанский, а интерфейс сайта был
       * переключён на русский — и экран ошибки пришёл на испанском.
       *
       * Прочитать выбор с сайта отсюда нельзя ни куки, ни хранилищем: этот
       * файл загружен с ЛОКАЛЬНОГО адреса (`https://localhost/error.html`,
       * см. `Bridge.getErrorUrl()`), а выбор живёт на источнике
       * `https://rusofacilapp.com`. Разные источники — общего хранилища у
       * них нет вовсе.
       *
       * Поэтому значение приносит оболочка: `MainActivity` помнит локаль
       * последней открытой страницы и зовёт эту функцию, как только видит
       * на экране адрес экрана ошибки. Функция объявлена ЗДЕСЬ и вызывается
       * ОТТУДА — то есть язык в разметке не зашит и запасной путь остаётся
       * прежним, пока оболочка молчит (первый запуск: помнить ещё нечего).
       */
      window.__rfApplyLocale = applyLocale;

      // Пока оболочка молчит — язык телефона, как и раньше. Первый запуск
      // после установки другого источника и не имеет.
      applyLocale((navigator.language || "").slice(0, 2));
      idleLabel = say("retry");


      /**
       * ПОЧЕМУ СНАЧАЛА ПРОБА, А НЕ СРАЗУ ПЕРЕХОД (долг 181).
       *
       * Переход рвёт этот документ в тот же миг: webview показывает пустой
       * прямоугольник, пока грузится адрес, и — если сети по-прежнему нет —
       * возвращает этот же экран через пару секунд. Снаружи это выглядит
       * как поломка, а не как попытка, и ровно так это и описал владелец.
       *
       * Проба отвечает на тот же вопрос, ничего не разрушая: `no-cors`
       * даёт непрозрачный ответ, читать его не нужно и нельзя — важно
       * ровно одно, дошёл запрос или упал. Дошёл — уходим на сайт, и
       * пустого кадра почти нет, потому что ответ уже в пути. Не дошёл —
       * остаёмся на месте и говорим об этом словами.
       */
      button.addEventListener("click", function () {
        if (button.getAttribute("data-busy") === "1") return;
        button.setAttribute("data-busy", "1");
        button.disabled = true;
        label.textContent = say("retrying");

        var done = false;
        var startedAt = Date.now();
        var fail = function () {
          if (done) return;
          done = true;
          setTimeout(function () {
            button.removeAttribute("data-busy");
            button.disabled = false;
            label.textContent = idleLabel;
            body.textContent = say("failed");
          }, Math.max(0, MIN_BUSY_MS - (Date.now() - startedAt)));
        };
        var timer = setTimeout(fail, PROBE_TIMEOUT_MS);

        var go = function () {
          if (done) return;
          done = true;
          clearTimeout(timer);
          location.href = SITE_URL;
        };

        fetch(SITE_URL, { mode: "no-cors", cache: "no-store" }).then(go, function () {
          clearTimeout(timer);
          // Проба не дошла. Если слепого перехода ещё не было — делаем
          // его: каркас на источнике сайта пробе недоступен, а переходу
          // доступен (см. шапку BLIND_MARK).
          if (!blindTryUsed()) {
            markBlindTry();
            go();
            return;
          }
          fail();
        });
      });
    </script>
  </body>
</html>
